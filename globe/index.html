<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地球 · AI-LAB ATLAS</title>
<meta name="description" content="AI-LAB ATLAS 总入口：可旋转缩放的三维地球。选中地标即展示该地实拍照片卡片，点击进入照片详情页。云、日照、雨雪为程序化模拟。">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/globe.css">
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>

<!-- 环境光罩：按时刻 / 季节 / 天气变化（纯 CSS，不改贴图） -->
<div class="grade" id="grade" aria-hidden="true"></div>
<div class="weather" id="weather" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="vig" aria-hidden="true"></div>

<!-- 近镜头水珠：极少量，只在雨档位出现 -->
<div class="lens" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

<header class="top">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" aria-hidden="true">
      <circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4v17.2"/><path d="M6 18.4c3.2-3.6 9-3.6 12 0" opacity=".55"/>
    </svg>
    <span class="brand__txt"><span class="brand__name">AI-LAB ATLAS</span><span class="brand__sub">总入口 · 地球</span></span>
  </div>
  <div class="badges">
    <span class="badge" id="fps">— fps</span>
    <span class="badge badge--sim" id="simBadge">真实时间 · 日照按 UTC 推算</span>
  </div>
</header>

<!-- 地标标记（DOM 投影，跟随三维坐标） -->
<div class="pins" id="pins" aria-label="地标标记"></div>

<!-- 建筑卡：一张实拍照片 + 事实信息，点击进入照片详情页 -->
<aside class="card" id="card" hidden aria-live="polite">
  <div class="card__thumb" id="cardThumb"></div>
  <div class="card__body">
    <p class="card__eyebrow" id="cardGeo"></p>
    <h1 class="card__name" id="cardName"></h1>
    <p class="card__en" id="cardEn"></p>
    <p class="card__credit" id="cardCredit" hidden></p>
    <p class="card__blurb" id="cardBlurb"></p>
    <p class="card__state" id="cardState"></p>
    <a class="card__enter" id="cardEnter" href="#" hidden>进入照片详情 <span>→</span></a>
  </div>
</aside>

<!-- 环境面板：默认收起，只留一枚低存在感入口 -->
<button class="envToggle" id="envToggle" type="button" aria-expanded="false" aria-controls="env">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
    <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>
  </svg>
  <span>环境</span>
  <span class="envToggle__hint">云 · 日照 · 雨雪</span>
</button>

<section class="env" id="env" hidden aria-label="环境控制">
  <div class="env__hd">
    <span class="env__title">环境 <span class="env__sim">模拟</span></span>
    <button class="env__close" id="envClose" type="button" aria-label="收起环境面板">收起 <span aria-hidden="true">▴</span></button>
  </div>

  <div class="env__row">
    <span class="env__k" id="hourK">时刻</span>
    <input id="hour" class="env__range" type="range" min="0" max="23.5" step="0.5" value="17.5" aria-labelledby="hourK">
    <span class="env__v" id="hourOut">17:30</span>
  </div>
  <div class="env__row">
    <span class="env__k">日照</span>
    <div class="chips" id="timeModes" role="group" aria-label="日照计算方式"></div>
  </div>
  <div class="env__row">
    <span class="env__k">季节</span>
    <div class="chips" id="seasons" role="group" aria-label="模拟季节"></div>
  </div>
  <div class="env__row">
    <span class="env__k">天气</span>
    <div class="chips" id="weathers" role="group" aria-label="模拟天气"></div>
  </div>
  <div class="env__row">
    <span class="env__k">雨量</span>
    <div class="chips" id="rainLevels" role="group" aria-label="模拟雨量"></div>
  </div>
  <div class="env__row">
    <span class="env__k">特效</span>
    <div class="chips" id="fxModes" role="group" aria-label="特效档位"></div>
  </div>

  <a class="env__browse" href="../halls/index.html">
    <span>按洲浏览 · 七洲展厅</span><span aria-hidden="true">→</span>
  </a>

  <div class="env__row env__row--seed">
    <span class="env__k">种子</span>
    <span class="env__v env__seed" id="seedOut">—</span>
    <button class="env__reset" id="reseed" type="button">随机天气</button>
  </div>
  <div class="env__row env__row--wide">
    <span class="env__k">时区</span>
    <span class="env__v env__tz" id="tzOut">巴黎 · 设备时间</span>
    <button class="env__reset" id="reset" type="button">复位</button>
  </div>
</section>

<footer class="foot">
  <span class="foot__hint">拖动旋转 · 滚轮/双指缩放 · 悬停标记拉近</span>
  <span id="texState">贴图 低清 → 高清</span>
  <span class="foot__fx" id="fxState">云 — · 雨 0 · 雪 0</span>
  <span class="foot__attr">地球贴图 NASA Blue Marble（公有领域）· 云、日照、雨雪为程序化模拟，非实时气象</span>
</footer>

<div class="loader" id="loader"><span class="loader__dot"></span><span>正在校准地球</span></div>
<div class="nowebgl" id="nowebgl" hidden>
  <p class="nowebgl__t">此设备未启用 WebGL</p>
  <p class="nowebgl__d">地球需要 WebGL。可直接打开巴黎圣母院照片页：<a href="notre-dame/index.html">notre-dame/index.html</a></p>
</div>

<script src="assets/landmarks.js"></script>
<script src="assets/earth-low.js"></script>
<script src="assets/three.min.js"></script>
<script src="assets/globe.js"></script>
</body>
</html>
