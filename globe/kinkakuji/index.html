<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金阁寺 · 镜湖池（实拍分层）— AI-LAB ATLAS</title>
<meta name="description" content="金阁寺（鹿苑寺）镜湖池实拍分层：晴日与雪日两张 CC0 公共领域照片，可切换时刻、季节与模拟天气；四处建筑部位各藏一处能力标记（影像 / 网页 / 幻灯片 / 游戏）。">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="kj.css">
<link rel="stylesheet" href="kj-photo.css">
</head>
<body class="t-dusk w-clear s-autumn">

<div class="frame" id="frame">
  <div class="back" aria-hidden="true"></div>
  <div class="clouds" aria-hidden="true"></div>
  <div class="rays" aria-hidden="true"></div>
  <div class="fog" aria-hidden="true"></div>
  <div class="wet" aria-hidden="true"></div>
  <div class="motes" id="motes" aria-hidden="true"></div>

  <div class="stage">
    <svg class="wing" id="wing" viewBox="0 0 1200 840" preserveAspectRatio="xMidYMid slice" role="img"
         aria-label="金阁寺镜湖池实拍分层绘景">

      <defs>
        <radialGradient id="hotGrad">
          <stop offset="0" stop-color="#ffe4b0" stop-opacity=".92"/>
          <stop offset="1" stop-color="#ffe4b0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="hazeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#cfd8c8" stop-opacity="0"/>
          <stop offset="1" stop-color="#c9d3c2" stop-opacity=".42"/>
        </linearGradient>
      </defs>

      <!-- 晴日池畔：CC0 实拍，本地化，无外链 -->
      <g class="scene scene--pond">
        <image class="photo" href="assets/kj-pond.jpg" x="0" y="0" width="1200" height="840"
               preserveAspectRatio="none"/>

        <ellipse cx="600" cy="812" rx="620" ry="52" fill="url(#hazeGrad)" opacity=".5"/>

        <g class="marks" data-set="pond">
          <g class="mark" data-k="deck" tabindex="0" role="button" aria-label="幻灯片 · HTML PPT">
            <ellipse class="hot" cx="575" cy="272" rx="66" ry="44"/>
            <rect class="hit" x="527" y="248" width="96" height="50"/>
            <text x="575" y="276">幻灯片</text>
          </g>
          <g class="mark" data-k="web" tabindex="0" role="button" aria-label="网页 · 单页作品">
            <ellipse class="hot" cx="578" cy="334" rx="58" ry="40"/>
            <rect class="hit" x="536" y="312" width="86" height="44"/>
            <text x="578" y="338">网页</text>
          </g>
          <g class="mark" data-k="video" tabindex="0" role="button" aria-label="影像 · HTML 短片">
            <ellipse class="hot" cx="600" cy="600" rx="86" ry="50"/>
            <rect class="hit" x="546" y="576" width="108" height="50"/>
            <text x="600" y="604">影像</text>
          </g>
          <g class="mark" data-k="game" tabindex="0" role="button" aria-label="游戏 · 小型可玩场景">
            <ellipse class="hot" cx="940" cy="505" rx="58" ry="42"/>
            <rect class="hit" x="898" y="483" width="86" height="44"/>
            <text x="940" y="509">游戏</text>
          </g>
        </g>
      </g>

      <!-- 雪日：同寺另一机位，CC0 实拍；仅天气为「雪」时交叉淡入 -->
      <g class="scene scene--snow" aria-hidden="true">
        <image class="photo" href="assets/kj-snow.jpg" x="0" y="0" width="1200" height="840"
               preserveAspectRatio="none"/>

        <ellipse cx="600" cy="812" rx="620" ry="52" fill="url(#hazeGrad)" opacity=".34"/>

        <g class="marks" data-set="snow">
          <g class="mark" data-k="deck" tabindex="-1" role="button" aria-label="幻灯片 · HTML PPT">
            <ellipse class="hot" cx="650" cy="126" rx="64" ry="42"/>
            <rect class="hit" x="604" y="104" width="92" height="46"/>
            <text x="650" y="130">幻灯片</text>
          </g>
          <g class="mark" data-k="web" tabindex="-1" role="button" aria-label="网页 · 单页作品">
            <ellipse class="hot" cx="640" cy="192" rx="56" ry="38"/>
            <rect class="hit" x="598" y="171" width="84" height="42"/>
            <text x="640" y="196">网页</text>
          </g>
          <g class="mark" data-k="video" tabindex="-1" role="button" aria-label="影像 · HTML 短片">
            <ellipse class="hot" cx="560" cy="545" rx="84" ry="46"/>
            <rect class="hit" x="508" y="522" width="104" height="46"/>
            <text x="560" y="549">影像</text>
          </g>
          <g class="mark" data-k="game" tabindex="-1" role="button" aria-label="游戏 · 小型可玩场景">
            <ellipse class="hot" cx="790" cy="660" rx="56" ry="40"/>
            <rect class="hit" x="748" y="639" width="84" height="42"/>
            <text x="790" y="664">游戏</text>
          </g>
        </g>
      </g>

      <!-- 时刻染色：暖 soft-light + 冷 multiply -->
      <rect class="grade grade--warm" x="-40" y="-40" width="1280" height="920" fill="#ffab66"/>
      <rect class="grade grade--cool" x="-40" y="-40" width="1280" height="920" fill="#0b1a2e"/>
    </svg>
  </div>

  <canvas class="wx" id="wx" aria-hidden="true"></canvas>

  <div class="edge" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vig" aria-hidden="true"></div>
</div>

<header class="top">
  <a class="crumb" href="../index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4v17.2"/></svg>
    <span>AI-LAB ATLAS<span class="crumb__sub">地球 · 京都</span></span>
  </a>
  <div class="badges">
    <span class="badge" id="clockOut">京都 —:—</span>
    <span class="badge badge--sim" id="simBadge">模拟环境 · 非实时天气</span>
    <a class="badge badge--link" href="../halls/as/index.html">亚洲厅</a>
  </div>
</header>

<section class="env" id="env">
  <div class="env__row">
    <span class="env__k">时刻</span>
    <input id="hour" class="env__range" type="range" min="0" max="23.5" step="0.5" value="17.5" aria-label="模拟时刻">
    <span class="env__v" id="hourOut">17:30</span>
  </div>
  <div class="env__row">
    <span class="env__k">季节</span>
    <div class="chips" id="seasons" role="group" aria-label="模拟季节"></div>
  </div>
  <div class="env__row">
    <span class="env__k">天气</span>
    <div class="chips" id="weathers" role="group" aria-label="模拟天气"></div>
  </div>
  <div class="env__row">
    <span class="env__k">特效</span>
    <div class="chips" id="fxs" role="group" aria-label="特效档位"></div>
  </div>
  <div class="env__row env__row--wide">
    <span class="env__k">来源</span>
    <span class="env__v env__seed" id="linkOut">本页手动</span>
    <button class="env__reset" id="reseed" type="button">换种子</button>
  </div>
</section>

<div class="title" id="title">
  <p class="title__eyebrow">JAPAN · KYOTO · KITAYAMA</p>
  <h1 class="title__cn">金阁寺</h1>
  <p class="title__en">KINKAKU-JI · ROKUON-JI</p>
  <p class="title__meta">镜湖池 · 实拍底图 · 室町 1397 / 1955 重建<br>CC0 照片分层示意 · 时刻/天气为模拟</p>
</div>

<div class="note">
  <span>四类能力各藏于一处</span>
  <span class="note__dim">底图 GoodFreePhotos · CC0；时刻/季节/天气为模拟</span>
</div>

<aside class="sheet" id="sheet" hidden aria-live="polite">
  <button class="sheet__close" id="sheetClose" aria-label="返回取景">×</button>
  <p class="sheet__k" id="sheetK"></p>
  <h2 class="sheet__h" id="sheetH"></h2>
  <p class="sheet__en" id="sheetEn"></p>
  <p class="sheet__d" id="sheetD"></p>
  <p class="sheet__case" id="sheetCase"></p>
  <a class="sheet__go" id="sheetGo" href="../halls/as/index.html">同语义四门 · 亚洲厅 <span>→</span></a>
  <p class="sheet__foot">作品位：results/&lt;model-slug&gt;/&lt;case-id&gt;/v01/</p>
</aside>

<div class="loader" id="loader"><span></span>正在铺开画面</div>

<script src="kj.js"></script>
</body>
</html>
