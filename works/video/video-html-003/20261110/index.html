<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const W=1920, H=1080, GROUND=902, RX=760, RY=900, RS=1.28;

/* ============================================================
   TIMELINE
   ============================================================ */
const SEG=[
  {id:"s1", cn:"一笔画",   en:"ONE-LINE",     t0:0.0,  t1:16.0},
  {id:"s2", cn:"水彩",     en:"WATERCOLOUR",  t0:16.0, t1:33.5},
  {id:"s3", cn:"孔版印刷", en:"RISOGRAPH",    t0:33.5, t1:50.5},
  {id:"s4", cn:"黑板粉笔", en:"CHALKBOARD",   t0:50.5, t1:68.0},
  {id:"s5", cn:"铜版画",   en:"COPPERPLATE",  t0:68.0, t1:85.5},
  {id:"s6", cn:"装饰艺术", en:"ART DECO",     t0:85.5, t1:104.0}
];
const TOTAL=104.0;
/* transition windows: [start, end, kind] */
const TRANS=[
  {at:16.0, a:15.0, b:17.0, kind:"brush"},
  {at:33.5, a:33.0, b:34.6, kind:"roller"},
  {at:50.5, a:49.7, b:51.4, kind:"panel"},
  {at:68.0, a:67.0, b:69.6, kind:"eraser"},
  {at:85.5, a:84.4, b:87.0, kind:"iris"}
];

/* ============================================================
   SMALL UTILS
   ============================================================ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,u)=>a+(b-a)*u;
const eio=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const eo=u=>1-Math.pow(1-u,3);
const ei=u=>u*u*u;
const sm=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u);};
const f1=n=>Math.round(n*10)/10;
const pad2=n=>String(n).padStart(2,"0");

/* ============================================================
   THE RIDER — one geometry, six renderings
   ============================================================ */
const BIKE={
  wr:76, rear:[-150,-76], front:[150,-76], bb:[0,-72],
  seat:[-54,-196], headTop:[104,-216], headBot:[92,-160], bar:[126,-236]
};
const BODY_D="M-150 -246 C-158 -292 -118 -326 -64 -330 C-14 -334 24 -314 32 -282 C40 -252 20 -226 -10 -216 C-56 -200 -118 -206 -140 -228 C-148 -236 -150 -240 -150 -246 Z";
const TAIL_D="M-140 -246 L-198 -268 L-184 -240 L-200 -226 L-142 -220 Z";
const NECK_D="M-8 -286 C8 -322 20 -348 30 -366 L58 -384 C46 -352 34 -316 20 -304 Z";
const HEAD_D="M66 -400 m-36 0 a36 30 0 1 0 72 0 a36 30 0 1 0 -72 0";
const BEAK_D="M92 -428 C150 -432 230 -420 282 -402 C288 -400 288 -394 280 -392 C226 -386 150 -390 90 -400 Z";
const POUCH_D="M98 -400 C104 -378 132 -362 176 -362 C216 -362 250 -376 268 -390 C226 -386 152 -386 98 -400 Z";
const WING_D="M-20 -300 C20 -300 74 -282 108 -246 C118 -236 114 -226 100 -226 C76 -226 54 -240 38 -254 C18 -268 -4 -278 -26 -284";
const BASKET_D="M132 -286 L222 -286 L216 -220 L138 -220 Z";
/* webbed claw, drawn centred on (0,0) so it can be anchored to the pedal axle */
const FOOT_D="M-10 3 L-5 -5 L3 -6 L10 -1 L9 3 L2 5 L-4 5 Z";

function spokes(){
  let s="";
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    s+='<line class="spoke" x1="0" y1="0" x2="'+f1(58*Math.cos(a))+'" y2="'+f1(58*Math.sin(a))+'"/>';
  }
  return s;
}
function wheel(which){
  const p = which==="A" ? BIKE.rear : BIKE.front;
  return '<g class="wheel wheel'+which+'" transform="translate('+p[0]+','+p[1]+')">'
    +'<circle class="pr-tire" r="76"/>'
    +'<circle class="pr-rim" r="63"/>'
    +'<g class="spokes">'+spokes()+'</g>'
    +'<circle class="pr-hub" r="6.5"/>'
    +'</g>';
}
function riderMarkup(mode,idp){
  const g='<g class="rider" id="'+idp+'">';
  const backLeg='<path class="pr-legB" d=""/><path class="pr-footB" d="'+FOOT_D+'"/>';
  const bike=
    wheel("A")+wheel("B")
    +'<path class="pr-frame" d="M-150 -76 L0 -72 M-150 -76 L-54 -196 M-54 -196 L0 -72 M0 -72 L92 -160 M-54 -196 L104 -216 M92 -160 L104 -216 M92 -160 L150 -76 M104 -216 L126 -236"/>'
    +'<path class="pr-bar" d="M126 -236 C146 -245 161 -239 157 -226"/>'
    +'<path class="pr-saddle" d="M-74 -200 L-30 -205"/>'
    +'<g class="crankG" transform="translate(0,-72)">'
      +'<g class="crank"><path class="pr-crank" d="M-44 0 L44 0"/></g>'
      +'<g class="pedalA"><rect class="pr-pedal" x="-13" y="-4" width="26" height="8" rx="2"/></g>'
      +'<g class="pedalB"><rect class="pr-pedal" x="-13" y="-4" width="26" height="8" rx="2"/></g>'
      +'<circle class="pr-hub" r="7"/></g>';
  const bird=
    '<path class="pr-tail" d="'+TAIL_D+'"/>'
    +'<path class="pr-body" d="'+BODY_D+'"/>'
    +'<path class="pr-neck" d="'+NECK_D+'"/>'
    +'<path class="pr-head" d="'+HEAD_D+'"/>'
    +'<path class="pr-beak" d="'+BEAK_D+'"/>'
    +'<path class="pr-pouch" d="'+POUCH_D+'"/>'
    +'<path class="pr-crest" d="M36 -420 C28 -436 18 -440 10 -438 M44 -426 C40 -442 32 -448 24 -449"/>'
    +'<circle class="pr-eye" cx="76" cy="-408" r="4.8"/>'
    +'<path class="pr-cheek" d="M46 -392 C58 -384 76 -382 90 -388"/>'
    +'<path class="pr-wing" d="'+WING_D+'"/>'
    +'<path class="pr-feather" d="M30 -266 C50 -260 68 -250 84 -238 M14 -278 C36 -272 54 -262 70 -250"/>'
    +'<path class="pr-scarf" d=""/>'
    +'<path class="pr-legA" d=""/><path class="pr-footA" d=""/>'
    +'<path class="pr-basket" d="'+BASKET_D+'"/>'
    +'<g class="pr-wicker">'
      +'<path d="M140 -272 L214 -272 M142 -258 L213 -258 M144 -244 L211 -244 M146 -230 L208 -230"/>'
    +'</g>'
    +'<g class="letterG" transform="translate(150,-282) rotate(-7)">'
      +'<rect class="pr-letter" x="0" y="0" width="58" height="38" rx="2"/>'
      +'<path class="pr-letterSeam" d="M0 0 L29 21 L58 0"/>'
    +'</g>';
  return g+backLeg+bike+bird+'</g>';
}

/* ---- rider state machine ---- */
function makeRider(mode,idp){
  const host=document.getElementById("scenes");
  const wrap=document.createElementNS(NS,"g");
  wrap.setAttribute("id",idp+"-wrap");
  wrap.setAttribute("transform","translate("+RX+","+RY+") scale("+RS+")");
  wrap.innerHTML=riderMarkup(mode,idp);
  const r={
    mode, node:wrap,
    q:s=>wrap.querySelector(s),
    wheelA:null,wheelB:null,crank:null,pA:null,pB:null,
    legA:null,legB:null,footA:null,footB:null,scarf:null,
    body:null,head:null,letter:null
  };
  r.wheelA=wrap.querySelector(".wheelA");
  r.wheelB=wrap.querySelector(".wheelB");
  r.crank=wrap.querySelector(".crank");
  r.pA=wrap.querySelector(".pedalA");
  r.pB=wrap.querySelector(".pedalB");
  r.legA=wrap.querySelector(".pr-legA");
  r.legB=wrap.querySelector(".pr-legB");
  r.footA=wrap.querySelector(".pr-footA");
  r.footB=wrap.querySelector(".pr-footB");
  r.scarf=wrap.querySelector(".pr-scarf");
  r.body=wrap.querySelector(".pr-body");
  r.head=wrap.querySelector(".pr-head");
  r.letter=wrap.querySelector(".letterG");
  r.update=function(t,cad,amp){
    const th=cad*t;
    const c=Math.cos(th), s=Math.sin(th);
    const bb=BIKE.bb;
    const p1=[bb[0]+44*c, bb[1]+44*s];
    const p2=[bb[0]-44*c, bb[1]-44*s];
    this.wheelA.setAttribute("transform","translate("+BIKE.rear[0]+","+BIKE.rear[1]+") rotate("+f1(th*57.2958*0.62)+")");
    this.wheelB.setAttribute("transform","translate("+BIKE.front[0]+","+BIKE.front[1]+") rotate("+f1(th*57.2958*0.62)+")");
    this.crank.setAttribute("transform","rotate("+f1(th*57.2958)+")");
    this.pA.setAttribute("transform","translate("+f1(p1[0]-bb[0])+","+f1(p1[1]-bb[1])+")");
    this.pB.setAttribute("transform","translate("+f1(p2[0]-bb[0])+","+f1(p2[1]-bb[1])+")");
    /* ankle is pinned to the pedal axle; knee comes from the two-bone solution.
       heel dips a little around bottom dead centre (sin th ≈ 1). */
    const hip=[-24,-216];
    const fa=-2.5-5.5*s;
    const leg=(ankle,el,ft)=>{
      const k=ik(hip,ankle);
      el.setAttribute("d","M"+hip[0]+" "+hip[1]+" L"+f1(k[0])+" "+f1(k[1])+" L"+f1(ankle[0])+" "+f1(ankle[1]));
      ft.setAttribute("transform","translate("+f1(ankle[0])+","+f1(ankle[1])+") rotate("+f1(fa)+")");
    };
    leg(p1,this.legA,this.footA);
    leg(p2,this.legB,this.footB);
    // scarf — tapered ribbon trailing behind the neck
    const pts=[];
    for(let i=0;i<=8;i++){
      const x=14-i*28;
      const y=-332-i*2.0+Math.sin(t*4.2-i*.62)*amp*(1+i*.06);
      pts.push([x,y]);
    }
    let d="";
    for(let i=0;i<pts.length;i++) d+=(i?" L":"M")+f1(pts[i][0])+" "+f1(pts[i][1]);
    for(let i=pts.length-1;i>=0;i--){
      const w=(26-(22)*(i/(pts.length-1)))*0.62;
      d+=" L"+f1(pts[i][0])+" "+f1(pts[i][1]+w);
    }
    this.scarf.setAttribute("d",d+" Z");
  };
  return r;
}
function ik(hip,foot){
  const l1=98,l2=100;
  const dx=foot[0]-hip[0], dy=foot[1]-hip[1];
  const d=Math.max(Math.hypot(dx,dy),1);
  const a=Math.atan2(dy,dx);
  const cosv=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1);
  const ang=Math.acos(cosv);
  const k1=[hip[0]+l1*Math.cos(a-ang),hip[1]+l1*Math.sin(a-ang)];
  const k2=[hip[0]+l1*Math.cos(a+ang),hip[1]+l1*Math.sin(a+ang)];
  return k1[0]>k2[0]?k1:k2;
}


/* ============================================================

/* ============================================================
   SCENE 6 — ART DECO
   ============================================================ */
function buildS6(){
  const g=document.createElementNS(NS,"g");
  g.setAttribute("id","s6");
  let rays="";
  for(let i=0;i<44;i++){
    const a=i*(360/44)*Math.PI/180;
    rays+='<line x1="0" y1="0" x2="'+f1(1500*Math.cos(a))+'" y2="'+f1(1500*Math.sin(a))+'" stroke="url(#gold)" stroke-width="'+(i%3===0?2:0.9)+'" opacity="'+(i%2?.13:.24)+'"/>';
  }
  let bulbs="";
  for(let i=0;i<15;i++){
    const x=1000+i*46, y=300-Math.sin(i/14*Math.PI)*62;
    bulbs+='<circle class="bulb" cx="'+x+'" cy="'+f1(y)+'" r="6" fill="#fff3c4" opacity="0"/>';
  }
  let towers="";
  const tw=[[80,560,150,420],[250,640,190,340],[460,500,120,480],[600,700,160,280],[1540,600,170,380],[1730,520,190,460]];
  tw.forEach(t=>{
    towers+='<rect x="'+t[0]+'" y="'+t[1]+'" width="'+t[2]+'" height="'+t[3]+'" fill="#0e0b08" stroke="url(#gold)" stroke-width="2"/>';
    for(let k=1;k<4;k++){
      const w=t[2]*(1-k*0.2), x=t[0]+(t[2]-w)/2;
      towers+='<rect x="'+x+'" y="'+(t[1]-k*26)+'" width="'+w+'" height="26" fill="#0e0b08" stroke="url(#gold)" stroke-width="1.6"/>';
    }
    for(let r=0;r<Math.floor(t[3]/54)-1;r++)
      for(let c=0;c<Math.floor(t[2]/40);c++)
        if((r+c)%3===0) towers+='<rect x="'+(t[0]+14+c*40)+'" y="'+(t[1]+26+r*54)+'" width="12" height="20" fill="#e8c477" opacity=".55"/>';
  });
  g.innerHTML=
    '<rect width="1920" height="1080" fill="#14100c"/>'
    +'<rect x="0" y="0" width="1920" height="1080" fill="#1a140e"/>'
    +'<g transform="translate(1300,330)"><g class="sunrays">'+rays+'</g></g>'
    +'<circle cx="1300" cy="330" r="300" fill="url(#lampGlow)"/>'
    +'<g id="s6-city">'+towers+'</g>'
    /* lighthouse under the arch, right of the rider's resting spot */

      +'<path d="M1310 900 L1340 470 L1460 470 L1490 900 Z" fill="#1b1710" stroke="url(#gold)" stroke-width="3"/>'
      +'<path d="M1326 760 H1474 M1320 830 H1480 M1334 620 H1466" stroke="url(#gold)" stroke-width="2" opacity=".8"/>'
      +'<path d="M1336 470 L1464 470 L1464 430 L1336 430 Z" fill="#0e0b08" stroke="url(#gold)" stroke-width="2.6"/>'
      +'<rect x="1356" y="400" width="88" height="30" fill="#0e0b08" stroke="url(#gold)" stroke-width="2.4"/>'
      +'<circle cx="1400" cy="415" r="9" fill="#fff3c4"/>'
      +'<path d="M1350 400 L1450 400 L1422 372 L1378 372 Z" fill="#0e0b08" stroke="url(#gold)" stroke-width="2.4"/>'
      +'<path d="M1400 330 L1410 372 L1390 372 Z" fill="url(#gold)"/>'
      +'<g class="beamG" transform="translate(1400,415)"><path d="M0 0 L980 -170 L980 170 Z" fill="#fff0bf" opacity=".07"/><path d="M0 0 L-980 -170 L-980 170 Z" fill="#fff0bf" opacity=".035"/></g>'
    +'</g>'
    /* marquee arch */

      +'<path d="M960 900 C960 690 1180 640 1300 640 C1420 640 1640 690 1640 900" fill="none" stroke="url(#gold)" stroke-width="2.4"/>'
      +'<path d="M960 900 C960 710 1180 662 1300 662 C1420 662 1640 710 1640 900" fill="none" stroke="url(#gold)" stroke-width="1" opacity=".65"/>'
      +bulbs

    +'<path d="M0 914 H1920" stroke="url(#gold)" stroke-width="1"/>'

const host=document.getElementById("scenes");
const S={};
function mount(key,builder){
  const g=builder();
  host.appendChild(g);
  S[key]=g;
}
mount("s1",buildS1);
mount("s2",buildS2);
mount("s3",buildS3);
mount("s4",buildS4);
mount("s5",buildS5);
mount("s6",buildS6);

/* riders */
const riders={};
function attachRider(key,mode){
  const r=makeRider(mode,key);
  S[key].querySelector("#"+key+"-rider").appendChild(r.node);
  riders[key]=r;
  return r;
}
attachRider("s1","line");

/* ============================================================
   ANIMATION STATE PER SCENE
   ============================================================ */
const R1=riders.s1, R2=riders.s2, R3=riders.s3, R4=riders.s4, R5=riders.s5, R6=riders.s6;

/* draw-on helper */
function drawOn(el,start,dur,lt){
  const u=clamp((lt-start)/dur,0,1);
  if(!el) return;
  el.setAttribute("pathLength","1");
  if(u<=0){el.setAttribute("stroke-dasharray","1 1");el.setAttribute("stroke-dashoffset","1");el.style.opacity="0";}
  else if(u>=1){el.removeAttribute("stroke-dasharray");el.removeAttribute("stroke-dashoffset");el.style.opacity="";}
  else{
    el.setAttribute("pathLength","1");
    el.setAttribute("stroke-dasharray","1 1");
    el.setAttribute("stroke-dashoffset",String(1-u));
    el.style.opacity="";
  }
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(t){
  /* ---------- scene 1 ---------- */
  if(t>=0 && t<18.5){
    const lt=t;
    const lines=S.s1.querySelectorAll(".ol-line");
    lines.forEach((el,i)=>{
      drawOn(el,0.0+i*0.28,1.2,lt);
    });
    /* rider draw-on — ordered like one hand travelling over the paper */
    const startFor=(el)=>{
      const c=(el.getAttribute("class")||"")+(el.parentNode&&el.parentNode.getAttribute?(" "+el.parentNode.getAttribute("class")):"");
      if(/pr-tire|pr-rim|spoke|pr-hub/.test(c)) return 4.2;
      if(/pr-frame|pr-bar|pr-saddle|pr-crank|pr-pedal/.test(c)) return 5.0;
      if(/pr-body|pr-tail|pr-wing/.test(c)) return 5.8;
      if(/pr-neck|pr-head/.test(c)) return 6.6;
      if(/pr-beak|pr-pouch|pr-eye|pr-crest/.test(c)) return 7.2;
      if(/pr-leg|pr-foot/.test(c)) return 7.7;
      if(/pr-basket|pr-wicker/.test(c)) return 8.0;
      if(/pr-letter/.test(c)) return 8.6;
      return 5.8;
    };
    const parts=S.s1.querySelectorAll("#s1-rider path, #s1-rider circle, #s1-rider line, #s1-rider rect");
    parts.forEach((el)=>{
      const start=startFor(el);
      if(el.tagName==="line"){ const u=clamp((lt-start)/.5,0,1); el.style.opacity=u; }
      else drawOn(el,start,/pr-letter/.test(el.getAttribute("class")||"")?1.1:.75,lt);
    });
    const rideStart=9.6;
    R1.update(Math.max(0,lt-rideStart),2.6,7);
    /* body bob */
    const bob=Math.sin((lt-rideStart)*5.2)*2.2;
    R1.node.setAttribute("transform","translate("+RX+","+(RY+bob)+") scale("+RS+")");
    /* title */
    document.getElementById("s1titleClip").setAttribute("width",String(clamp((lt-1.0)/2.4,0,1)*1100));
    S.s1.style.display="";
  } else if(t>=18.5) S.s1.style.display="none";
  else S.s1.style.display="none";

  /* ---------- scene 2 ---------- */
  if(t>=15.0 && t<=35.0){
    const lt=t-16.0;
    S.s2.style.display="";
    R2.update(Math.max(0,lt)+6,2.5,9);
    const bob=Math.sin((lt+6)*5.1)*2.4;
    R2.node.setAttribute("transform","translate("+RX+","+(RY+bob)+") scale("+RS+")");
    /* camera: slow lateral dolly */
    const pan=-eio(clamp((lt+1.0)/19,0,1))*150;
    S.s2.querySelector(".wc").setAttribute("transform","translate("+f1(pan)+",0)");
    S.s2.querySelectorAll(".wc").forEach((n,i)=>n.setAttribute("transform","translate("+f1(pan*(1-i*0.02))+",0)"));
    /* wipe in */
    const a=15.0,b=17.0;
    const u=clamp((t-a)/(b-a),0,1);
    const x=-80+eio(u)*(2060);
    document.getElementById("s2wipePath").setAttribute("d",
      "M -40 -40 H "+f1(x)+" L "+f1(x+22)+" 160 L "+f1(x-16)+" 340 L "+f1(x+24)+" 520 L "+f1(x-18)+" 700 L "+f1(x+18)+" 880 L "+f1(x-10)+" 1120 H -40 Z");
    /* wet edge just inside the boundary */
    const edgeD="M "+f1(x-12)+" -40 L "+f1(x+10)+" 160 L "+f1(x-28)+" 340 L "+f1(x+12)+" 520 L "+f1(x-30)+" 700 L "+f1(x+6)+" 880 L "+f1(x-22)+" 1120";
    document.getElementById("wetEdgeCream").setAttribute("d",edgeD);
    document.getElementById("wetEdgeInk").setAttribute("d",edgeD);
    S.s2.setAttribute("clip-path",u<1?"url(#clipS2)":"");
  } else S.s2.style.display="none";

  /* ---------- scene 3 ---------- */
  if(t>=32.0 && t<=52.0){
    const lt=t-33.5;
    S.s3.style.display="";
    R3.update(Math.max(0,lt)+11,2.55,8);
    const bob=Math.sin((lt+11)*5.3)*2;
    R3.node.setAttribute("transform","translate("+RX+","+(RY+bob)+") scale("+RS+")");
    /* parallax pan */
    const pan=-eio(clamp((lt+1.4)/18.5,0,1))*260;
    const far=S.s3.querySelector("#s3-city");
    far.setAttribute("transform","translate("+f1(pan*0.35)+",-100)");
    S.s3.querySelectorAll(":scope > rect").forEach(()=>{});
    /* roller intro */
    const a=33.0,b=34.6,u=clamp((t-a)/(b-a),0,1);
    const x=-140+eio(u)*2200;
    document.getElementById("s3wipePath").setAttribute("d",
      "M -40 -40 H "+f1(x)+" L "+f1(x+18)+" 200 L "+f1(x-14)+" 420 L "+f1(x+16)+" 640 L "+f1(x-12)+" 860 L "+f1(x+10)+" 1120 H -40 Z");
    S.s3.setAttribute("clip-path",u<1?"url(#clipS3)":"");
    /* the roller runs ahead of the ink edge */
    const band=document.getElementById("rollerBand"), core=document.getElementById("rollerCore");
    if(u>0&&u<1){
      band.style.display=""; core.style.display="";
      band.setAttribute("x",String(f1(x+30)));
      core.setAttribute("x",String(f1(x+84)));
    } else { band.style.display="none"; core.style.display="none"; }
    /* registration kick at 40.0 */
    const kick=Math.max(0,1-Math.abs(t-40.3)/0.42);
    const k=Math.sin(kick*Math.PI)*10;
    R3.node.setAttribute("transform","translate("+(RX+k)+","+(RY+bob-k*0.3)+") scale("+RS+")");
  } else S.s3.style.display="none";

  /* ---------- scene 4 ---------- */
  if(t>=49.0 && t<=70.0){
    const lt=t-50.5;
    S.s4.style.display="";
    /* panel slide in */
    const a=49.7,b=51.4,u=clamp((t-a)/(b-a),0,1);
    const px=(1-eio(u))*1980;
    S.s4.setAttribute("transform","translate("+f1(px)+",0)");
    /* naive drawing draws in then gets wiped */
    const naive=S.s4.querySelector("#s4-naive");
    const nu=clamp((lt-1.2)/2.6,0,1);
    naive.style.opacity=nu>0?1:0;
    naive.querySelectorAll(".chalk-y").forEach((el,i)=>{
      el.setAttribute("pathLength","1");
      el.setAttribute("stroke-dasharray","1 1");
      el.setAttribute("stroke-dashoffset",String(1-clamp((nu-i*0.18)/0.45,0,1)));
    });
    const wipeT=clamp((lt-4.1)/1.0,0,1);
    const eraser=S.s4.querySelector("#s4-eraser");
    if(wipeT>0&&wipeT<1){
      eraser.style.display="";
      document.getElementById("eraserRect").setAttribute("x",String(f1(-260+eio(wipeT)*1400)));
      naive.style.opacity=String(1-wipeT);
    } else {eraser.style.display="none"; if(wipeT>=1) naive.style.opacity=0;}
    /* the real pelican rides across the board */
    const rideOn=clamp((lt-5.3)/2.2,0,1);
    R4.node.style.display=rideOn>0?"":"none";
    R4.node.querySelectorAll("path,circle,line,rect").forEach((el,i)=>{
      if(el.classList.contains("pr-wicker")) return;
      const d=clamp((rideOn*1.6)-i*0.012,0,1);
      if(el.tagName==="line"){el.style.opacity=String(d*0.7);}
      else{
        el.setAttribute("pathLength","1");
        el.setAttribute("stroke-dasharray","1 1");
        el.setAttribute("stroke-dashoffset",String(1-d));
      }
    });
    R4.update(Math.max(0,lt-7.4),2.7,7);
    const bob=Math.sin((lt-7.4)*5.2)*2.2;
    R4.node.setAttribute("transform","translate("+RX+","+(RY+bob)+") scale("+RS+")");
    /* camera pan across the board */
    const pan=-eio(clamp((lt-6)/12,0,1))*180;
    S.s4.querySelector(".s4-grid").setAttribute("transform","translate("+f1(pan)+",0)");
  } else S.s4.style.display="none";

  /* ---------- scene 5 ---------- */
  if(t>=66.0 && t<=87.5){
    const lt=t-68.0;
    S.s5.style.display="";
    /* eraser wipe revealing the plate */
    const a=67.0,b=69.6,u=clamp((t-a)/(b-a),0,1);
    const x=-160+u*2200;
    document.getElementById("s5wipePath").setAttribute("d",
      "M -40 -40 H "+f1(x)+" Q "+f1(x+30)+" 240 "+f1(x)+" 520 Q "+f1(x-26)+" 800 "+f1(x+8)+" 1120 H -40 Z");
    S.s5.setAttribute("clip-path",u<1?"url(#clipS5)":"");
    /* chalk dust smeared just behind the eraser */
    const smudge=document.getElementById("eraseSmudge");
    if(u>0&&u<1){
      smudge.style.display="";
      smudge.setAttribute("d","M "+f1(x-78)+" -40 Q "+f1(x-44)+" 240 "+f1(x-78)+" 520 Q "+f1(x-112)+" 800 "+f1(x-70)+" 1120");
    } else smudge.style.display="none";
    /* build order: outline → hatch sweep → wash */
    const bu=clamp((lt-0.6)/3.4,0,1);
    S.s5.querySelectorAll(".eng path, .eng-head, .eng-beak, .eng-pouch, .eng-crest").forEach((el,i)=>{
      el.setAttribute("pathLength","1");
      el.setAttribute("stroke-dasharray","1 1");
      el.setAttribute("stroke-dashoffset",String(1-clamp(bu*1.7-i*0.05,0,1)));
    });
    const h=clamp((lt-3.2)/2.4,0,1);
    S.s5.querySelectorAll(".pr-hatch").forEach(el=>el.setAttribute("opacity",String(0.5*h)));
    /* the wash blooms on the letter */
    const wu=clamp((lt-10.0)/2.0,0,1);
    R5.node.querySelector(".pr-letter").setAttribute("opacity",String(0.25+0.75*wu));
    R5.update(Math.max(0,lt)+16,2.45,8);
    const bob=Math.sin((lt+16)*5.0)*2.1;
    R5.node.setAttribute("transform","translate("+RX+","+(RY+bob)+") scale("+RS+")");
    /* slow loupe push then hold */
    const push=sm(0,4,lt)*0.0;
    S.s5.querySelectorAll(".eng-roundel").forEach(n=>{
      const u2=clamp((lt-4.0)/1.6,0,1);
      n.setAttribute("opacity",String(u2));
      n.setAttribute("transform","translate(0,"+f1((1-eo(u2))*30)+")");
    });
    S.s5.setAttribute("transform","");
  } else S.s5.style.display="none";

  /* ---------- scene 6 ---------- */
  if(t>=84.0){
    const lt=t-85.5;
    S.s6.style.display="";
    /* iris */
    const a=84.4,b=87.0,u=clamp((t-a)/(b-a),0,1);
    const r=Math.pow(u,1.35)*1800;
    document.getElementById("s6iris").setAttribute("r",String(f1(r)));
    S.s6.setAttribute("clip-path",u<1?"url(#clipS6)":"");
    /* bulbs */
    const b0=1.6;
    S.s6.querySelectorAll(".bulb").forEach((el,i)=>{
      const on=clamp((lt-(b0+i*0.075))/0.22,0,1);
      el.setAttribute("opacity",String(eo(on)));
      const sc=on<1?1+0.9*(1-on):1;
      el.setAttribute("r",String(f1(6*sc)));
    });
    /* beam sweep */
    const beam=S.s6.querySelector(".beamG");
    beam.setAttribute("transform","translate(1030,415) rotate("+f1(Math.sin((lt-4)*0.55)*16)+")");
    const rays=S.s6.querySelector(".sunrays");
    rays.setAttribute("transform","rotate("+f1(lt*1.6)+")");
    /* rider approaches and stops at the door */
    const rideT=Math.max(0,lt);
    R6.update(rideT,2.4,7);
    const arrive=clamp((lt-3.5)/7.0,0,1);
    const rx=lerp(RX,1010,eo(arrive));
    const bob=Math.sin(rideT*5.0)*2.0*(1-arrive*0.8);
    R6.node.setAttribute("transform","translate("+f1(rx)+","+(RY+bob)+") scale("+RS+")");
    /* letter leaves the basket */
    const lu=clamp((lt-11.6)/1.8,0,1);
    const lg=R6.letter;
    if(lu>0){
      lg.setAttribute("transform","translate("+f1(150+lu*150)+","+f1(-282-lu*145)+") rotate("+f1(-7-lu*180)+") scale("+f1(1-lu*0.55)+")");
      lg.setAttribute("opacity",String(1-lu*0.85));
    } else {lg.setAttribute("transform","translate(150,-282) rotate(-7)");lg.setAttribute("opacity","1");}
    /* end card */
    const cu=clamp((lt-14.2)/1.4,0,1);
    const card=S.s6.querySelector("#s6-title");
    card.setAttribute("opacity",String(cu));
    R6.node.setAttribute("opacity",String(1-cu*0.82));
  } else S.s6.style.display="none";

  updateHUD(t);
}

/* HUD */
const fillEl=document.getElementById("fill");
const knobEl=document.getElementById("knob");
const chapEl=document.getElementById("chap");
const tcEl=document.getElementById("tc");
const barEl=document.getElementById("bar");
const hud=document.getElementById("hud");
SEG.forEach(s=>{
  const d=document.createElement("div");
  d.className="tick";
  d.style.left=(s.t0/TOTAL*100)+"%";
  barEl.appendChild(d);
});
const fmt=s=>pad2(Math.floor(s/60+1e-6))+":"+pad2(Math.floor(s%60+1e-6));
function updateHUD(t){
  const p=clamp(t/TOTAL,0,1);
  fillEl.style.width=(p*100)+"%";
  knobEl.style.left=(p*100)+"%";
  let idx=0;
  for(let i=0;i<SEG.length;i++) if(t>=SEG[i].t0) idx=i;
  chapEl.textContent=pad2(idx+1)+" · "+SEG[idx].cn+" / "+SEG[idx].en;
  tcEl.textContent=fmt(t)+" / "+fmt(TOTAL);
  hud.classList.toggle("on-dark", (t>=33.5 && t<68.0) || t>=85.4);
}

/* ============================================================
   CLOCK
   ============================================================ */
const qs=new URLSearchParams(location.search);
const state={t: qs.has("t")?clamp(parseFloat(qs.get("t"))||0,0,TOTAL):0,
             playing:true, dragging:false};
if(qs.get("pause")==="1") state.playing=false;
let last=performance.now();
function loop(now){
  const dt=Math.min(0.06,(now-last)/1000); last=now;
  if(state.playing && !state.dragging){
    // 首帧的 rAF 时间戳可能早于 0，dt 会把时间拉到负数；t<0 时每段渲染都无定义
    state.t = Math.max(0, state.t + dt);
    if(state.t>TOTAL){state.t=TOTAL;state.playing=false;}
  }
  render(state.t);
  requestAnimationFrame(loop);
}

/* ---------- seeking ---------- */
const frameEl=document.getElementById("frame");
const scrubEl=document.getElementById("scrub");
function timeFromX(clientX){
  const r=barEl.getBoundingClientRect();
  const p=clamp((clientX-r.left)/Math.max(r.width,1),0,1);
  return p*TOTAL;
}
function chapterAt(t){
  let i=0;
  for(let k=0;k<SEG.length;k++) if(t>=SEG[k].t0) i=k;
  return i;
}
function showScrub(clientX){
  const fr=frameEl.getBoundingClientRect();
  const br=barEl.getBoundingClientRect();
  const idx=chapterAt(state.t);
  scrubEl.textContent=fmt(state.t)+" · "+pad2(idx+1)+" "+SEG[idx].cn;
  scrubEl.style.left=clamp(clientX-fr.left,44,fr.width-44)+"px";
  scrubEl.style.top=Math.max(10,br.top-fr.top-38)+"px";
  scrubEl.classList.add("on");
}
function applySeek(t){
  state.t=clamp(t,0,TOTAL);
  render(state.t);
  barEl.setAttribute("aria-valuenow",state.t.toFixed(2));
}
function seekBy(d){
  applySeek(state.t+d);
  last=performance.now();
}

/* pointer / touch drag */
let dragPid=null, dragWasPlaying=false;
function onDown(e){
  if(e.pointerType==="mouse" && e.button!==0) return;
  e.preventDefault();
  dragPid=e.pointerId;
  dragWasPlaying=state.playing;
  state.dragging=true;
  state.playing=false;
  barEl.classList.add("drag");
  try{barEl.setPointerCapture(e.pointerId);}catch(err){}
  applySeek(timeFromX(e.clientX));
  showScrub(e.clientX);
}
function onMove(e){
  if(!state.dragging || e.pointerId!==dragPid) return;
  e.preventDefault();
  applySeek(timeFromX(e.clientX));
  showScrub(e.clientX);
}
function onUp(e){
  if(!state.dragging) return;
  if(dragPid!==null && e.pointerId!==undefined && e.pointerId!==dragPid) return;
  state.dragging=false;
  dragPid=null;
  barEl.classList.remove("drag");
  scrubEl.classList.remove("on");
  last=performance.now();
  state.playing=dragWasPlaying && state.t<TOTAL;
}
barEl.addEventListener("pointerdown",onDown);
barEl.addEventListener("pointermove",onMove);
barEl.addEventListener("pointerup",onUp);
barEl.addEventListener("pointercancel",onUp);
barEl.addEventListener("lostpointercapture",onUp);

render(state.t);
requestAnimationFrame(loop);

window.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();state.playing=!state.playing;last=performance.now();return;}
  if(e.key==="r"||e.key==="R"){applySeek(0);state.playing=true;last=performance.now();return;}
  if(e.key==="c"||e.key==="C"){
    const n=SEG.find(s=>s.t0>state.t+0.3);
    applySeek(n?n.t0:0);
    last=performance.now();
    return;
  }
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    e.preventDefault();
    const step=e.shiftKey?5:1;
    seekBy(e.key==="ArrowLeft"?-step:step);
  }
});
window.PELICAN={render:(t)=>{applySeek(t);},state,SEG,TRANS,TOTAL,
  seek:applySeek, timeFromX};
})();
</script>
