<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>雨夜便利店街角 / Rainy Night Konbini Corner</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070d;}
  #c{display:block;width:100%;height:100%;cursor:grab;touch-action:none;}
  #c.drag{cursor:grabbing;}
  #vig{position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(120% 92% at 50% 42%,rgba(0,0,0,0) 44%,rgba(2,4,9,.60) 100%);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<script src="../../../../vendor/three.min.js"></script>
<script>
/* file:// 自检：three.min.js 未加载时给出明确的控制台原因，避免只看到黑屏 */
if (typeof THREE === 'undefined') {
  throw new Error('[雨夜便利店] three.min.js 未加载：请确认 vendor/three.min.js 与作品目录的相对位置未被移动。');
}
</script>
<script>
'use strict';
/* =========================================================
   雨夜便利店街角 · 三渲二微缩场景
   three.js r124 / 无外部请求 / 程序化建模与贴图
   ========================================================= */

const TAU = Math.PI * 2;
const canvasEl = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a111d, 36, 82);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 160);

/* r124 兼容：几何体统一走 BufferGeometry 版本 */
['Box', 'Plane', 'Circle', 'Ring', 'Cylinder', 'Cone', 'Torus', 'Tube', 'Shape', 'Sphere', 'Extrude']
  .forEach(k => {
    if (THREE[k + 'BufferGeometry']) THREE[k + 'Geometry'] = THREE[k + 'BufferGeometry'];
  });

/* ---------- 随机数（确定性） ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = mulberry32(20261110);
const rnd = (a, b) => a + R() * (b - a);
const pick = (arr) => arr[Math.floor(R() * arr.length) % arr.length];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- 贴图工具 ---------- */
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang SC","Noto Sans JP",sans-serif';
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function tex(c, rx, ry) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (rx || ry) t.repeat.set(rx || 1, ry || 1);
  t.anisotropy = 8;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 卡通分段渐变 */
function toonGradient() {
  const [c, x] = makeCanvas(4, 1);
  ['#2e2e2e', '#565656', '#9a9a9a', '#ffffff'].forEach((col, i) => {
    x.fillStyle = col; x.fillRect(i, 0, 1, 1);
  });
  const t = new THREE.CanvasTexture(c);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  return t;
}
const GRAD = toonGradient();

/* 背景夜空 */
function bgTexture() {
  const [c, x] = makeCanvas(1024, 1024);
  const g = x.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#04060c');
  g.addColorStop(0.52, '#0a1220');
  g.addColorStop(0.78, '#111b2a');
  g.addColorStop(1, '#18222f');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  const rg = x.createRadialGradient(500, 700, 20, 500, 700, 560);
  rg.addColorStop(0, 'rgba(255,170,96,.16)');
  rg.addColorStop(0.4, 'rgba(96,84,140,.10)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = rg; x.fillRect(0, 0, 1024, 1024);
  return tex(c);
}
scene.background = bgTexture();

/* 光晕 sprite 贴图 */
const GLOW = (() => {
  const [c, x] = makeCanvas(128, 128);
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.22, 'rgba(255,255,255,.62)');
  g.addColorStop(0.55, 'rgba(255,255,255,.15)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return tex(c);
})();

/* 纵向光带（湿地反光） */
const STREAK = (() => {
  const [c, x] = makeCanvas(64, 256);
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, 'rgba(255,255,255,.85)');
  g.addColorStop(0.35, 'rgba(255,255,255,.30)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 256);
  const gx = x.createLinearGradient(0, 0, 64, 0);
  gx.addColorStop(0, 'rgba(0,0,0,1)');
  gx.addColorStop(0.5, 'rgba(0,0,0,0)');
  gx.addColorStop(1, 'rgba(0,0,0,1)');
  x.globalCompositeOperation = 'destination-out';
  x.fillStyle = gx; x.fillRect(0, 0, 64, 256);
  return tex(c);
})();

/* 径向柔光（地面积光） */
const HALO = (() => {
  const [c, x] = makeCanvas(256, 256);
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,255,255,.9)');
  g.addColorStop(0.4, 'rgba(255,255,255,.35)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return tex(c);
})();

/* 玻璃雨痕 */
function glassRainTexture() {
  const [c, x] = makeCanvas(256, 512);
  x.clearRect(0, 0, 256, 512);
  for (let i = 0; i < 190; i++) {
    const px = R() * 256, py = R() * 512, r = 0.6 + R() * 2.4;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,.75)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
  }
  for (let i = 0; i < 26; i++) {
    const px = R() * 256, py = R() * 512, h = 20 + R() * 120;
    const g = x.createLinearGradient(px, py, px, py + h);
    g.addColorStop(0, 'rgba(255,255,255,.20)');
    g.addColorStop(0.7, 'rgba(255,255,255,.06)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.strokeStyle = g;
    x.lineWidth = 0.9 + R() * 1.5;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px, py + h); x.stroke();
  }
  const t = tex(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* 沥青 */
function asphaltTexture() {
  const [c, x] = makeCanvas(256, 256);
  x.fillStyle = '#232a39'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    const v = 20 + Math.floor(R() * 34);
    x.fillStyle = 'rgba(' + v + ',' + (v + 5) + ',' + (v + 14) + ',' + (0.25 + R() * 0.4) + ')';
    x.fillRect(R() * 256, R() * 256, 1 + R() * 2, 1 + R() * 2);
  }
  for (let i = 0; i < 8; i++) {
    x.fillStyle = 'rgba(12,16,26,.35)';
    x.beginPath();
    x.ellipse(R() * 256, R() * 256, 12 + R() * 30, 8 + R() * 20, R() * TAU, 0, TAU);
    x.fill();
  }
  return tex(c, 5, 5);
}

/* 人行道砖 */
function pavementTexture() {
  const [c, x] = makeCanvas(256, 256);
  x.fillStyle = '#737d90'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5; i++) {
    for (let j = 0; j < 5; j++) {
      const v = 108 + Math.floor(R() * 18);
      x.fillStyle = 'rgb(' + (v - 14) + ',' + (v - 8) + ',' + v + ')';
      x.fillRect(i * 51 + 2, j * 51 + 2, 47, 47);
    }
  }
  x.strokeStyle = 'rgba(48,56,72,.55)'; x.lineWidth = 2;
  for (let i = 0; i <= 5; i++) {
    x.beginPath(); x.moveTo(i * 51, 0); x.lineTo(i * 51, 256); x.stroke();
    x.beginPath(); x.moveTo(0, i * 51); x.lineTo(256, i * 51); x.stroke();
  }
  for (let i = 0; i < 240; i++) {
    x.fillStyle = 'rgba(40,48,62,' + (0.05 + R() * 0.16) + ')';
    x.fillRect(R() * 256, R() * 256, 2 + R() * 6, 1 + R() * 3);
  }
  return tex(c, 3, 3);
}

/* 店内浅色地砖 */
function floorTileTexture() {
  const [c, x] = makeCanvas(256, 256);
  x.fillStyle = '#d9d3c4'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 4; j++) {
      const v = 214 + Math.floor(R() * 16);
      x.fillStyle = 'rgb(' + v + ',' + (v - 4) + ',' + (v - 14) + ')';
      x.fillRect(i * 64 + 1, j * 64 + 1, 62, 62);
    }
  }
  x.strokeStyle = 'rgba(150,144,130,.5)'; x.lineWidth = 1.4;
  for (let i = 0; i <= 4; i++) {
    x.beginPath(); x.moveTo(i * 64, 0); x.lineTo(i * 64, 256); x.stroke();
    x.beginPath(); x.moveTo(0, i * 64); x.lineTo(256, i * 64); x.stroke();
  }
  return tex(c, 4, 4);
}

/* 盲道 */
function tactileTexture() {
  const [c, x] = makeCanvas(64, 64);
  x.fillStyle = '#d8a83c'; x.fillRect(0, 0, 64, 64);
  x.fillStyle = 'rgba(255,232,168,.9)';
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 4; j++) {
      x.beginPath(); x.arc(8 + i * 16, 8 + j * 16, 4.4, 0, TAU); x.fill();
    }
  }
  x.fillStyle = 'rgba(120,84,20,.25)';
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    x.beginPath(); x.arc(9 + i * 16, 9.4 + j * 16, 4.2, 0, TAU); x.fill();
  }
  return tex(c, 2, 8);
}

/* 排水沟箅子 */
function grateTexture() {
  const [c, x] = makeCanvas(128, 64);
  x.fillStyle = '#2b3242'; x.fillRect(0, 0, 128, 64);
  x.fillStyle = '#111722';
  for (let i = 0; i < 8; i++) x.fillRect(6 + i * 15, 8, 8, 48);
  x.strokeStyle = 'rgba(150,168,196,.35)'; x.lineWidth = 2;
  x.strokeRect(2, 2, 124, 60);
  return tex(c, 8, 1);
}

/* 招牌：横 */
function fasciaTexture() {
  const [c, x] = makeCanvas(1024, 200);
  x.fillStyle = '#f6f2e7'; x.fillRect(0, 0, 1024, 200);
  x.fillStyle = '#2c9b72'; x.fillRect(0, 150, 1024, 16);
  x.fillStyle = '#3b7fc0'; x.fillRect(0, 166, 1024, 14);
  x.fillStyle = '#ec8a33'; x.fillRect(0, 180, 1024, 20);
  // 星标
  x.save(); x.translate(92, 82);
  x.fillStyle = '#2c9b72';
  x.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 18 : 42;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  }
  x.closePath(); x.fill();
  x.fillStyle = '#fff';
  x.beginPath(); x.arc(0, 0, 9, 0, TAU); x.fill();
  x.restore();
  x.fillStyle = '#1d2537';
  x.font = 'bold 88px ' + FONT;
  x.textBaseline = 'middle';
  x.fillText('ほしぞらマート', 158, 74);
  x.fillStyle = '#5d6678';
  x.font = '500 26px ' + FONT;
  x.fillText('HOSHIZORA MART   ·   OPEN 24 HOURS', 162, 126);
  return tex(c);
}

/* 竖招牌 */
function bladeTexture() {
  const [c, x] = makeCanvas(192, 640);
  x.fillStyle = '#f7f3e9'; x.fillRect(0, 0, 192, 640);
  x.fillStyle = '#2c9b72'; x.fillRect(0, 0, 192, 12);
  x.fillStyle = '#3b7fc0'; x.fillRect(0, 12, 192, 8);
  x.fillStyle = '#ec8a33'; x.fillRect(0, 20, 192, 6);
  x.fillStyle = '#1d2537';
  x.font = 'bold 74px ' + FONT;
  x.textAlign = 'center';
  const s = 'ほしぞら';
  for (let i = 0; i < s.length; i++) x.fillText(s[i], 96, 118 + i * 88);
  x.fillStyle = '#2c9b72';
  x.font = 'bold 40px ' + FONT;
  x.fillText('24時間', 96, 522);
  x.fillStyle = '#5d6678';
  x.font = '500 26px ' + FONT;
  x.fillText('MART', 96, 572);
  x.fillStyle = '#ec8a33'; x.fillRect(20, 598, 152, 8);
  return tex(c);
}

/* 玻璃贴纸 */
function stickerTexture() {
  const [c, x] = makeCanvas(512, 256);
  x.clearRect(0, 0, 512, 256);
  const items = [
    ['ATM', '#2c9b72'], ['コピー', '#3b7fc0'], ['宅配便', '#ec8a33']
  ];
  items.forEach((it, i) => {
    x.fillStyle = it[1];
    rr(x, 16 + i * 164, 60, 148, 96, 12); x.fill();
    x.fillStyle = '#fff';
    x.font = 'bold 46px ' + FONT;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(it[0], 90 + i * 164, 110);
  });
  return tex(c);
}

/* 饮料柜 */
function coolerTexture() {
  const [c, x] = makeCanvas(512, 384);
  const g = x.createLinearGradient(0, 0, 0, 384);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#eef8ff'); g.addColorStop(1, '#d7e8f4');
  x.fillStyle = g; x.fillRect(0, 0, 512, 384);
  for (let d = 0; d < 4; d++) {
    const ox = d * 128;
    x.fillStyle = 'rgba(255,255,255,.9)'; x.fillRect(ox + 2, 0, 124, 384);
    for (let row = 0; row < 4; row++) {
      const by = 44 + row * 74;
      x.fillStyle = 'rgba(190,210,226,.55)'; x.fillRect(ox + 8, by + 52, 112, 5);
      for (let b = 0; b < 5; b++) {
        const bx = ox + 12 + b * 22;
        x.fillStyle = pick(['#e05a4a', '#3f7fc4', '#e8b33c', '#57b07c', '#8d6fc0', '#e88a3c', '#62bcd6']);
        rr(x, bx, by + 6, 16, 46, 5); x.fill();
        x.fillStyle = 'rgba(255,255,255,.55)'; x.fillRect(bx + 3, by + 16, 10, 5);
        x.fillStyle = '#2b3444'; x.fillRect(bx + 5, by, 6, 8);
      }
      x.fillStyle = '#f2c33c'; x.fillRect(ox + 8, by + 60, 112, 10);
      x.fillStyle = '#25303f';
      x.font = 'bold 11px ' + FONT;
      x.fillText(row % 2 ? 'つめたい' : 'あったか', ox + 12, by + 68);
    }
    x.fillStyle = '#bfd4e4'; x.fillRect(ox + 123, 0, 5, 384);
    x.fillStyle = '#e8f4ff'; x.fillRect(ox + 120, 0, 2, 384);
  }
  x.fillStyle = 'rgba(255,255,255,.92)'; x.fillRect(0, 0, 512, 24);
  x.fillStyle = '#2c9b72'; x.fillRect(0, 24, 512, 6);
  return tex(c);
}

/* 货架商品条 */
function goodsTexture(seed) {
  const rr2 = mulberry32(seed);
  const [c, x] = makeCanvas(512, 96);
  x.fillStyle = '#efe9db'; x.fillRect(0, 0, 512, 96);
  x.fillStyle = 'rgba(120,110,96,.20)'; x.fillRect(0, 0, 512, 8);
  x.fillStyle = '#cfc6b4'; x.fillRect(0, 84, 512, 12);
  const cols = ['#e4726a', '#e8b23f', '#5fb488', '#4f8fd0', '#9a7ccb', '#e98f4a', '#e8d15e', '#6ec2cf'];
  let px = 3;
  while (px < 508) {
    const w = 12 + Math.floor(rr2() * 22);
    const h = 44 + Math.floor(rr2() * 30);
    x.fillStyle = cols[Math.floor(rr2() * cols.length)];
    rr(x, px, 84 - h, w, h, 3); x.fill();
    x.fillStyle = 'rgba(255,255,255,.78)';
    x.fillRect(px + 2, 84 - h + 7, Math.max(3, w - 4), 9);
    x.fillStyle = 'rgba(0,0,0,.22)';
    x.fillRect(px + 3, 84 - h + 20, Math.max(2, w - 8), 3);
    x.fillStyle = 'rgba(255,255,255,.35)';
    x.fillRect(px + 2, 84 - h + 5, 2, h - 8);
    px += w + 3;
  }
  x.fillStyle = '#f4c64a'; x.fillRect(0, 76, 512, 8);
  return tex(c);
}

/* 杂志架 */
function magazineTexture() {
  const [c, x] = makeCanvas(1024, 160);
  x.fillStyle = '#e6e0d2'; x.fillRect(0, 0, 1024, 160);
  x.fillStyle = '#c9c1b0'; x.fillRect(0, 132, 1024, 28);
  for (let i = 0; i < 9; i++) {
    const ox = 10 + i * 112;
    x.fillStyle = pick(['#df6f63', '#4d8fc9', '#e7b64a', '#6bb392', '#9b7fc9', '#e6975a', '#d96188']);
    rr(x, ox, 14, 92, 122, 3); x.fill();
    x.fillStyle = 'rgba(255,255,255,.9)';
    x.fillRect(ox + 8, 22, 62, 12);
    x.fillStyle = 'rgba(255,255,255,.75)';
    x.fillRect(ox + 8, 40, 46, 7);
    x.fillStyle = 'rgba(30,36,48,.55)';
    x.fillRect(ox + 8, 92, 76, 34);
    x.fillStyle = 'rgba(255,255,255,.5)';
    x.fillRect(ox + 12, 98, 40, 5);
  }
  return tex(c);
}

/* 店内海报 */
function posterTexture(kind) {
  const [c, x] = makeCanvas(256, 384);
  const palettes = [
    ['#f2c14e', '#d9553f', '#2c3f63'],
    ['#5fb0a4', '#f6f1e2', '#274a5e'],
    ['#e2795f', '#f3d9a4', '#48304f'],
    ['#6a8fce', '#f4e9c8', '#1f3352']
  ];
  const p = palettes[kind % palettes.length];
  x.fillStyle = p[1]; x.fillRect(0, 0, 256, 384);
  x.fillStyle = p[0];
  x.beginPath(); x.arc(196, 92, 92, 0, TAU); x.fill();
  x.fillStyle = p[2];
  x.fillRect(0, 238, 256, 146);
  x.fillStyle = '#ffffff';
  x.font = 'bold 42px ' + FONT;
  x.textAlign = 'left';
  x.fillText(kind % 2 ? 'あったか' : '新発売', 22, 282);
  x.font = 'bold 30px ' + FONT;
  x.fillText(kind % 2 ? 'おでん' : 'スイーツ', 22, 322);
  x.fillStyle = 'rgba(255,255,255,.82)';
  x.font = '500 17px ' + FONT;
  x.fillText('HOSHIZORA MART', 22, 356);
  x.fillStyle = p[0];
  rr(x, 172, 300, 62, 62, 8); x.fill();
  x.fillStyle = p[2];
  x.font = 'bold 24px ' + FONT; x.fillText('24', 180, 344);
  return tex(c);
}

/* 香烟柜 */
function cigaretteTexture() {
  const [c, x] = makeCanvas(512, 256);
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#fffdf4'); g.addColorStop(1, '#e6ddc9');
  x.fillStyle = g; x.fillRect(0, 0, 512, 256);
  for (let r = 0; r < 5; r++) {
    for (let i = 0; i < 14; i++) {
      x.fillStyle = pick(['#e8eef2', '#f3e0c0', '#d8e8ea', '#2f3d4c', '#e8c9a0', '#f0f0ee', '#c9d9e8']);
      x.fillRect(8 + i * 36, 12 + r * 48, 30, 40);
      x.fillStyle = 'rgba(40,50,66,.5)';
      x.fillRect(11 + i * 36, 18 + r * 48, 24, 5);
      x.fillStyle = 'rgba(40,50,66,.28)';
      x.fillRect(11 + i * 36, 36 + r * 48, 16, 3);
    }
    x.fillStyle = 'rgba(150,140,120,.35)'; x.fillRect(0, 54 + r * 48, 512, 3);
  }
  return tex(c);
}

/* 便当正视 */
function bentoTexture() {
  const [c, x] = makeCanvas(256, 160);
  x.fillStyle = '#f2e8d8'; x.fillRect(0, 0, 256, 160);
  for (let r = 0; r < 2; r++) {
    for (let i = 0; i < 3; i++) {
      const ox = 10 + i * 82, oy = 8 + r * 78;
      x.fillStyle = '#2c3341'; rr(x, ox, oy, 72, 68, 5); x.fill();

const rodCache = new THREE.Vector3();
function rod(ax, ay, az, bx, by, bz, r, mat, parent) {
  const a = new THREE.Vector3(ax, ay, az), b = new THREE.Vector3(bx, by, bz);
  const len = a.distanceTo(b);
  const geo = new THREE.CylinderGeometry(r, r, len, 6);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(rodCache.set(0, 1, 0), b.clone().sub(a).normalize());
  m.castShadow = false;
  (parent || ext).add(m);
  return m;
}

const ctrl = {
  target: new THREE.Vector3(0.2, 1.2, -0.7),
  theta: -0.7, phi: 1.24, dist: 33.5,
  tTheta: -0.7, tPhi: 1.24, tDist: 33.5,
  idle: 0
};
const pointers = new Map();
let pinchStart = 0, pinchDist0 = 0;
const canvasDom = renderer.domElement;

canvasDom.addEventListener('pointerdown', e => {
  canvasDom.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  ctrl.idle = 0;
  canvasDom.classList.add('drag');
  if (pointers.size === 2) {
    const p = Array.from(pointers.values());
    pinchDist0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    pinchStart = ctrl.tDist;
  }
});
canvasDom.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  ctrl.idle = 0;
  if (pointers.size === 1) {
    ctrl.tTheta -= dx * 0.0052;
    ctrl.tPhi -= dy * 0.0042;
    ctrl.tPhi = clamp(ctrl.tPhi, 0.16, 1.34);
  } else if (pointers.size === 2) {
    const arr = Array.from(pointers.values());
    const d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    if (pinchDist0 > 1) {
      ctrl.tDist = clamp(pinchStart * (pinchDist0 / Math.max(d, 1)), 13, 42);
    }
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) canvasDom.classList.remove('drag');
}
canvasDom.addEventListener('pointerup', endPointer);
canvasDom.addEventListener('pointercancel', endPointer);
canvasDom.addEventListener('wheel', e => {
  e.preventDefault();
  ctrl.tDist = clamp(ctrl.tDist * Math.exp(e.deltaY * 0.0011), 13, 42);
  ctrl.idle = 0;
}, { passive: false });

   ========================================================= */
const clock = new THREE.Clock();
const tmpColor = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* 相机阻尼 + 缓慢自转 */
  ctrl.idle += dt;
  if (ctrl.idle > 7 && pointers.size === 0) ctrl.tTheta += 0.055 * dt;
  ctrl.theta += (ctrl.tTheta - ctrl.theta) * Math.min(1, dt * 7);
  ctrl.phi += (ctrl.tPhi - ctrl.phi) * Math.min(1, dt * 7);
  ctrl.dist += (ctrl.tDist - ctrl.dist) * Math.min(1, dt * 5);
  const sp = Math.sin(ctrl.phi), cp = Math.cos(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.dist * sp * Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.dist * cp,
    ctrl.target.z + ctrl.dist * sp * Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);

  /* 雨 */
  rainMat.uniforms.uTime.value = t;
  rainMat2.uniforms.uTime.value = t * 0.92;

  /* 玻璃雨痕滚动 */
  glassRainMatA.map.offset.y += dt * 0.032;
  glassRainMatB.map.offset.y += dt * 0.052;
  /* 招牌闪烁（轻微呼吸 + 偶发压暗） */
  const dip = Math.max(0, Math.sin(t * 0.83) - 0.986) / 0.014;
  signFlicker = (0.94 + 0.06 * Math.sin(t * 2.1) * Math.sin(t * 5.3)) - dip * 0.35;
  signFlicker = clamp(signFlicker, 0.6, 1);
  bladeFace.material.color.setScalar(signFlicker);
  bladeGlow.material.opacity = 0.24 * signFlicker;
  fasciaSign.material.color.setScalar(0.96 + 0.04 * Math.sin(t * 0.9));
  chSign.material.color.setScalar(0.96 + 0.04 * Math.sin(t * 0.9 + 2));
  REFLECT.forEach((r, i) => {
    r.mesh.material.opacity = r.base * (0.86 + 0.14 * Math.sin(t * 1.3 + i)) * (i < 4 ? signFlicker * 0.5 + 0.5 : 1);
  });

  /* 自动门 */
  doorTimer -= dt;
  if (doorTimer <= 0 && doorTarget === 0 && doorHold <= 0) {
    doorTarget = 1;
    doorHold = 2.6;
    doorTimer = 14 + Math.random() * 5;
  }
  if (doorTarget === 1) {
    doorHold -= dt;
    if (doorHold <= 0) doorTarget = 0;
  }
  doorOpen += ((doorTarget ? 1 : 0) - doorOpen) * Math.min(1, dt * 2.1);
  doorL.position.x = -0.47 - doorOpen * 0.34;
  doorR.position.x = 0.47 + doorOpen * 0.34;
  doorWarm.opacity = 0.34 + doorOpen * 0.26;

  /* 信号灯 */
  const cyc = (t + 2) % 18;
  let phase = 2; // 0 绿 1 黄 2 红
  if (cyc < 8) phase = 2; else if (cyc < 10) phase = 1; else phase = 0;
  sigLenses.forEach((L, i) => {
    const on = (i === 0 && phase === 2) || (i === 1 && phase === 1) || (i === 2 && phase === 0);
    L.mat.color.copy(on ? L.color : tmpColor.setHex(0x272c34));
  });
  const sigCol = phase === 2 ? 0xff5a4f : (phase === 1 ? 0xffcf5a : 0x6fe3b4);
  sigGlow.material.color.setHex(sigCol);
  sigGlow.material.opacity = 0.20 + 0.03 * Math.sin(t * 8);
  pedLens.material.color.setHex(phase === 2 ? 0x6fe3b4 : 0x35252a);
  pedLens2.material.color.setHex(phase === 2 ? 0x35252a : 0x1f2a24);
  farLens.material.color.setHex(phase === 2 ? 0xff5a4f : 0x2a2328);
  farGlow.material.opacity = phase === 2 ? 0.12 : 0.03;
  lampGlow.material.opacity = 0.31 + 0.02 * Math.sin(t * 2.4);

  /* 涟漪 */
  rippleTimer -= dt;
  if (rippleTimer <= 0) {
    rippleTimer = 0.16 + Math.random() * 0.2;
    const p = PUDDLES[Math.floor(Math.random() * PUDDLES.length)];
    const a = Math.random() * TAU, rr2 = Math.sqrt(Math.random()) * 0.7;
    spawnRipple(p.x + Math.cos(a) * p.rx * rr2, p.z + Math.sin(a) * p.rz * rr2, 0.18 + Math.random() * 0.3);
  }
  ripples.forEach(o => {
    if (!o.active) return;
    o.life += dt;
    const k = o.life / o.max;
    if (k >= 1) {
      o.active = false; o.m.visible = false; o.mat.opacity = 0; return;
    }
    const s = 0.12 + k * o.size * 2.4;
    o.m.scale.set(s, s, 1);
    o.mat.opacity = (1 - k) * 0.42 * (0.5 + 0.5 * Math.sin(o.life * 9));
  });

  /* 檐口滴水 */
  drips.forEach(d => {
    const span = 2.9;
    const tt = (t * d.speed + d.phase) % (span / d.speed);
    const y = 2.92 - tt * d.speed;
    d.mesh.position.set(d.x, y, d.z);
    d.mesh.visible = y > 0.16;
    d.mesh.scale.y = 0.8 + Math.min(1.6, tt * 0.5);
    if (y <= 0.16 && d.mesh.visible) {
      spawnRipple(d.x, d.z, 0.16);
      d.mesh.visible = false;
    }
  });

  /* 关东煮热气 */
  steam.forEach(o => {
    const k = (t * o.sp + o.phase) % 1;
    o.s.position.set(4.95 + Math.sin(k * 5 + o.phase * 6) * 0.06, 1.72 + k * 0.6, -3.06 + Math.cos(k * 4) * 0.05);
    o.s.material.opacity = Math.sin(k * Math.PI) * 0.16;
    const sc = 0.2 + k * 0.34;
    o.s.scale.set(sc, sc, 1);
  });

  /* 旗子轻摆 */
  bannerGroup.rotation.z = Math.sin(t * 0.9) * 0.018;
  bannerMesh.rotation.y = Math.sin(t * 0.7) * 0.08;

  renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
