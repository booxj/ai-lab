<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURA · AI 成果展馆</title>
<meta name="description" content="AURA — 一个沉浸式的 AI 成果展示空间：网页、视频、PPT、游戏四扇门，各自独立的风格与配乐。">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/hall.css">
</head>
<body class="hall-body">
<a class="skip" href="#stage">跳到展馆</a>

<div id="stage"></div>

<div class="hall-title" id="hallTitle">
  <div class="ht-en">AURA</div>
  <div class="ht-cn">人工智能成果展馆</div>
  <div class="ht-rule"></div>
</div>

<div class="hall-hud">
  <div class="hud-l">
    <div><span class="dot"></span><b>展厅开放中</b> / FOUR GATES</div>
    <div>拖拽环视 · 滚轮推进 · 移动鼠标产生视差</div>
  </div>
  <div class="hud-r">
    <div>EXHIBIT NO. 04 — AI OUTPUTS 2026</div>
    <div>推荐佩戴耳机 · 每厅配乐独立</div>
  </div>
</div>

<button class="sound-toggle" type="button" aria-pressed="false" aria-label="切换配乐">
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span class="label">声音关</span>
</button>

<div class="grain" aria-hidden="true"></div>

<!-- 入口闸门 -->
<div class="gate-screen" id="gateScreen">
  <div class="gs-inner">
    <div class="gs-kicker">AI EXHIBITION · VOL.01</div>
    <h1 class="gs-title">AURA<em>·</em>成果展馆</h1>
    <p class="gs-sub">四扇门，四种完全不同的世界。纸境里的网页、放映厅里的影片、包豪斯式的演示、街机厅里的可玩实验。<br>每一厅有自己的光、自己的颜色、自己的声音。</p>
    <button class="gs-enter" id="gsEnter" type="button">进入展馆</button>
    <div class="gs-note">点击进入将开启空间配乐 · 建议佩戴耳机</div>
  </div>
</div>

<div class="dive-veil" id="diveVeil" aria-hidden="true"></div>
<div class="dive-flash" id="diveFlash" aria-hidden="true"></div>

<div class="hall-loader" id="hallLoader">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="hl-bar"><i></i></div>
    <div class="hl-txt">Building the hall</div>
  </div>
</div>

<script src="/assets/js/audio.js"></script>
<script src="/assets/js/core.js"></script>
<script type="module" src="/assets/js/hall.js"></script>
<script>
  // 入口闸门：点击后放行 3D 场景并启动配乐
  const gs = document.getElementById('gateScreen');
  const title = document.getElementById('hallTitle');
  document.getElementById('gsEnter').addEventListener('click', () => {
    gs.classList.add('is-gone');
    title.classList.add('is-hidden');
    if (window.Audio) { window.Audio.init(); window.Audio.play('hall'); }
    const btn = document.querySelector('.sound-toggle');
    if (btn) { btn.classList.add('is-on'); btn.classList.remove('is-off'); btn.querySelector('.label').textContent = '声音开'; }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !gs.classList.contains('is-gone')) {
      document.getElementById('gsEnter').click();
    }
  });
</script>
</body>
</html>
