<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>结果模板 · 请替换</title>
<style>
:root{--ink:#e9e4da;--dim:#8d877c;--line:rgba(233,228,218,.14);--bg:#0b0c0f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 0,rgba(201,162,94,.10),transparent 70%),var(--bg);color:var(--ink);font-family:Georgia,"Songti SC",serif}
.card{width:min(680px,88vw);border:1px solid var(--line);padding:34px 30px;background:rgba(255,255,255,.02)}
.k{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.24em;color:var(--dim);margin:0 0 14px}
h1{font-size:28px;font-weight:400;letter-spacing:.04em;margin:0 0 12px}
p{margin:0;color:var(--dim);font-size:13px;line-height:1.8}
code{font-family:ui-monospace,Menlo,monospace;color:#c9a25e}
@media (prefers-reduced-motion:no-preference){.card{animation:in .6s ease both}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="card">
  <p class="k">RESULTS / TEMPLATE</p>
  <h1>把这里换成作品</h1>
  <p>这是可复制的空模板。替换本页为 <code>result.html</code>，保持双击可离线打开；再填 <code>preview.png</code>、<code>prompt.md</code>、<code>meta.json</code>。规范见 <code>docs/CONVENTIONS.md</code>。</p>
</main>
</body>
</html>
