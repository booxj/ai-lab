<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI LAB · 星图 / 样张</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#05060a;
    --ink:#e9e4d8;
    --dim:rgba(233,228,216,.46);
    --hair:rgba(233,228,216,.16);
    --c-image:#e4c798;
    --c-video:#8c9ad8;
    --c-web:#7cbcc2;
    --c-ppt:#cecbc2;
    --c-game:#d07058;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Helvetica Neue","PingFang SC","Hiragino Sans GB","Songti SC",sans-serif;
    -webkit-font-smoothing:antialiased}
  .screen{position:fixed;inset:0;opacity:0;pointer-events:none;
    transition:opacity .3s cubic-bezier(.4,0,.2,1)}
  .screen.on{opacity:1;pointer-events:auto}
  .fatal{position:fixed;inset:0;z-index:40;background:#05060a;display:none;
    align-items:center;justify-content:center;text-align:center;padding:40px;
    font-size:12px;letter-spacing:.08em;color:var(--dim);line-height:2;white-space:pre-wrap}
  .fatal.on{display:flex}

  /* ——— 星图 ——— */
  #star{z-index:1;background:var(--bg)}
  #stage{position:absolute;inset:0}
  #stage canvas{display:block}
  #vignette{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(5,6,10,0) 38%, rgba(5,6,10,.72) 100%),
      radial-gradient(60% 45% at 68% 30%, rgba(70,78,120,.10), rgba(0,0,0,0) 70%),
      radial-gradient(50% 40% at 22% 72%, rgba(120,84,52,.07), rgba(0,0,0,0) 72%);
  }
  #sHead{
    position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:26px 30px;pointer-events:none;z-index:6;
  }
  .s-brand b{
    font-family:"Didot","Songti SC",serif;font-weight:400;font-size:19px;
    letter-spacing:.42em;display:block;line-height:1;
  }
  .s-brand span{display:block;margin-top:10px;font-size:10px;letter-spacing:.28em;color:var(--dim)}
  .s-brand .rule{width:44px;height:1px;background:var(--hair);margin-top:14px}
  .count{text-align:right;font-size:10px;letter-spacing:.22em;color:var(--dim);
    line-height:1.9;padding-top:3px}
  #legend{position:absolute;left:30px;bottom:28px;z-index:6;pointer-events:auto;
    font-size:10px;letter-spacing:.18em;color:var(--dim);line-height:2.1}
  #legend .lg{cursor:default;transition:color .18s ease}
  #legend .lg-h{font-size:8.5px;letter-spacing:.3em;color:rgba(233,228,216,.28);
    margin-bottom:7px}
  #legend .lg:hover,#legend .lg.on{color:rgba(233,228,216,.95)}
  #legend .lg.empty{color:rgba(233,228,216,.24);cursor:default}
  #legend .lg.empty i{opacity:.35}
  #legend i{display:inline-block;width:12px;height:8px;margin-right:9px;vertical-align:0;
    border:1px solid rgba(233,228,216,.16);transition:width .2s ease}
  #legend .lg.on i{width:18px}
  #sFoot{position:absolute;left:0;right:0;bottom:26px;z-index:6;pointer-events:none;
    display:flex;justify-content:center}
  #hint{font-size:10px;letter-spacing:.22em;color:rgba(233,228,216,.34)}
  #hint b{font-weight:400;color:rgba(233,228,216,.6)}
  #selection{position:absolute;left:30px;top:50%;transform:translateY(46px);z-index:6;
    font-size:10px;letter-spacing:.2em;color:var(--dim);display:none;
    max-width:220px;line-height:1.9}
  #selection.on{display:block}
  #selection a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair)}
  #card{position:absolute;left:0;top:0;z-index:9;pointer-events:none;opacity:0;
    transform:translate(-50%,-100%);
    transition:opacity .22s ease}
  #card.on{opacity:1}
  .card-in{width:212px;padding:9px;background:rgba(9,10,15,.93);
    border:1px solid rgba(233,228,216,.16);
    box-shadow:0 20px 56px rgba(0,0,0,.6);
    transform:translateY(12px);
    transition:transform .26s cubic-bezier(.22,.61,.36,1)}
  #card.on .card-in{transform:translateY(0)}
  .card-in .shot{height:120px;overflow:hidden;background:#0b0c12}
  .card-in .shot img{width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(.82) brightness(.96)}
  #card.noimg .shot{display:none}
  .card-in .t{margin-top:9px;font-family:"Didot","Songti SC",serif;
    font-size:14px;line-height:1.35;letter-spacing:.02em}
  .card-in .m{margin-top:5px;font-size:8.5px;letter-spacing:.2em;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-in .p{margin-top:7px;font-size:9px;line-height:1.62;letter-spacing:.02em;
    color:rgba(233,228,216,.46);display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .card-in .f{margin-top:7px;display:flex;justify-content:space-between;gap:8px;
    font-size:8px;letter-spacing:.14em;color:rgba(233,228,216,.3);white-space:nowrap}
  .card-in .f .k::before{content:"";display:inline-block;width:4px;height:4px;
    border-radius:50%;background:rgba(233,228,216,.26);margin-right:5px;vertical-align:1px}
  .card-in .f .k.live{color:rgba(233,228,216,.64)}
  .card-in .f .k.live::before{background:#7fd7c4}
  #card.noprompt .p{display:none}
  #intro{position:absolute;inset:0;z-index:20;background:#05060a;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .9s cubic-bezier(.4,0,.2,1)}
  #intro.done{opacity:0;pointer-events:none}
  .intro-in{text-align:center}
  .intro-in h1{margin:0;font-family:"Didot","Songti SC",serif;font-weight:400;
    font-size:clamp(30px,4.4vw,54px);letter-spacing:.5em;text-indent:.5em}
  .intro-in .sub{margin-top:22px;font-size:10px;letter-spacing:.34em;color:var(--dim)}
  .intro-in .bar{width:160px;height:1px;background:var(--hair);margin:26px auto 0;
    position:relative;overflow:hidden}
  .intro-in .bar::after{content:"";position:absolute;left:-40%;top:0;width:40%;height:1px;
    background:rgba(233,228,216,.75);animation:sweep 1.6s ease-in-out infinite}
  @keyframes sweep{0%{left:-40%}100%{left:100%}}

  /* ——— 能力页（#/<cap>）——— */
  #capPanel{position:absolute;right:30px;top:96px;z-index:6;width:252px;display:none;
    padding:14px 15px 16px;background:rgba(9,10,15,.84);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(233,228,216,.12)}
  #capPanel.on{display:block}
  #capPanel .cp-h{font-size:8.5px;letter-spacing:.3em;color:rgba(233,228,216,.34);
    padding-bottom:9px;border-bottom:1px solid var(--hair)}
  #capPanel .cp-h b{font-family:"Didot","Songti SC",serif;font-size:15px;font-weight:400;
    letter-spacing:.12em;color:var(--ink);display:block;margin-top:6px}
  #capPanel .cp-list{margin-top:4px;max-height:54vh;overflow:auto;scrollbar-width:thin}
  #capPanel .cp-list a{display:block;padding:8px 0;border-bottom:1px solid rgba(233,228,216,.07);
    color:rgba(233,228,216,.72);text-decoration:none;font-size:11px;line-height:1.45;
    letter-spacing:.02em;transition:color .18s ease}
  #capPanel .cp-list a:hover{color:var(--ink)}
  #capPanel .cp-list a i{font-style:normal;display:block;font-size:8px;letter-spacing:.18em;
    color:rgba(233,228,216,.3);margin-top:3px}
  #capPanel .cp-empty{font-size:9px;line-height:2;letter-spacing:.1em;
    color:rgba(233,228,216,.3);padding:10px 0}

  /* ——— 作品页（#/<cap>/<id>[/<ver>]）——— */
  #detail{z-index:12;background:#05060a}
  #dview{position:absolute;inset:0;background:#000;overflow:hidden}
  #dview .dlayer{position:absolute;inset:0;opacity:0;
    transition:opacity .25s cubic-bezier(.4,0,.2,1)}
  #dview .dlayer.on{opacity:1}
  #dview .dlayer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    transform-origin:50% 50%;will-change:transform;user-select:none;-webkit-user-drag:none}
  #dvid{position:absolute;left:0;top:0;width:100%;height:calc(100% - 196px);
    object-fit:contain;background:#000;opacity:0;
    transition:opacity .25s cubic-bezier(.4,0,.2,1)}
  #dvid.on{opacity:1}
  #detail.is-video .dfoot{display:none}
  #detail.is-video .dmeta{bottom:96px}
  #dshade{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:
      linear-gradient(to bottom, rgba(5,6,10,.82) 0%, rgba(5,6,10,0) 22%),
      linear-gradient(to top, rgba(5,6,10,.9) 0%, rgba(5,6,10,0) 30%),
      radial-gradient(120% 90% at 50% 50%, rgba(5,6,10,0) 55%, rgba(5,6,10,.55) 100%)}
  .dhead{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;
    justify-content:space-between;align-items:flex-start;padding:24px 30px;
    pointer-events:none}
  .dhead > *{pointer-events:auto}
  .dbrand a{color:var(--ink);text-decoration:none}
  .dbrand b{font-family:"Didot","Songti SC",serif;font-weight:400;font-size:18px;
    letter-spacing:.4em;display:block;line-height:1}
  .dbrand .dback{display:inline-block;margin-top:14px;font-size:10px;letter-spacing:.2em;
    color:var(--dim);text-decoration:none;border-bottom:1px solid var(--hair);
    padding-bottom:3px;transition:color .2s ease,border-color .2s ease}
  .dbrand .dback:hover{color:var(--ink);border-color:rgba(233,228,216,.5)}
  .dmark{text-align:right;font-size:9.5px;letter-spacing:.26em;color:var(--dim);line-height:1.9}
  .dmark .tag{color:var(--c-image);border:1px solid rgba(228,199,152,.32);
    padding:5px 9px;display:inline-block}
  .dmark .rule{width:46px;height:1px;background:var(--hair);margin:12px 0 0 auto}
  .dmeta{position:absolute;left:30px;bottom:54px;z-index:6;
    max-width:min(660px,48vw);pointer-events:none}
  .dmeta .didx{font-family:"Didot","Songti SC",serif;font-size:11px;letter-spacing:.22em;
    color:var(--dim);margin-bottom:12px}
  .dmeta .didx em{font-style:normal;color:var(--ink)}
  .dmeta h1{margin:0;font-family:"Didot","Songti SC",serif;font-weight:400;
    font-size:clamp(21px,2.5vw,34px);letter-spacing:.03em;line-height:1.28;
    text-wrap:balance}
  .dmeta .dsub{margin-top:10px;font-size:10px;letter-spacing:.2em;color:var(--dim);
    display:flex;flex-wrap:wrap;gap:0 14px}
  .dmeta .dsub em{font-style:normal;color:rgba(233,228,216,.78)}
  .dmeta .dsub i{display:inline-block;width:14px;height:1px;margin-right:7px;vertical-align:3px}
  #drail{position:absolute;right:30px;bottom:28px;z-index:6;display:flex;
    align-items:center;gap:14px}
  #drail .nav{width:30px;height:30px;border:1px solid var(--hair);background:transparent;
    color:var(--ink);font-size:11px;cursor:pointer;opacity:.62;
    transition:border-color .2s ease,opacity .2s ease}
  #drail .nav:hover{border-color:rgba(233,228,216,.45);opacity:1}
  #drail .nav:disabled{opacity:.16;cursor:default}
  #drail .count{font-size:10px;letter-spacing:.2em;color:var(--dim);min-width:56px;
    text-align:center}
  #drail .dots{display:flex;gap:6px;margin-right:4px}
  #drail .dots button{width:5px;height:5px;padding:0;border:0;border-radius:50%;
    cursor:pointer;background:rgba(233,228,216,.24);
    transition:background .25s ease,transform .25s ease}
  #drail .dots button.on{background:rgba(233,228,216,.8);transform:scale(1.5)}
  .dfoot{position:absolute;left:0;right:0;bottom:16px;z-index:5;display:flex;
    justify-content:center;pointer-events:none}
  .dfoot span{font-size:9.5px;letter-spacing:.2em;color:rgba(233,228,216,.3)}
  .dfoot b{font-weight:400;color:rgba(233,228,216,.52)}
  .dfatal{position:absolute;inset:0;z-index:20;background:#05060a;display:none;
    align-items:center;justify-content:center;text-align:center;padding:40px;
    font-size:12px;letter-spacing:.08em;color:var(--dim);line-height:2;
    white-space:pre-wrap}
  .dfatal.on{display:flex}

  /* ——— 统一全屏查看器（所有类型共用一个 HTML 入口）——— */
  #viewer{position:fixed;inset:0;z-index:40;background:#05060a;display:none;
    flex-direction:column}
  #viewer.on{display:flex}
  .vw-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;height:46px;
    padding:0 14px;background:rgba(5,6,10,.97);border-bottom:1px solid var(--hair)}
  .vw-bar button,.vw-bar a{background:transparent;border:1px solid var(--hair);
    color:var(--dim);font-size:9.5px;letter-spacing:.16em;padding:5px 10px;
    cursor:pointer;text-decoration:none;white-space:nowrap;
    transition:color .2s ease,border-color .2s ease}
  .vw-bar button:hover,.vw-bar a:hover{color:var(--ink);
    border-color:rgba(233,228,216,.45)}
  .vw-t{flex:1;min-width:0;font-size:9.5px;letter-spacing:.18em;color:rgba(233,228,216,.5);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vw-t b{font-weight:400;color:var(--ink)}
  .vw-stage{position:relative;flex:1;min-height:0;background:#05060a}
  #vwFrame{position:absolute;inset:0;width:100%;height:100%;border:0;
    background:#05060a;display:block}
  .vw-msg{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:40px;
    text-align:center;background:#05060a}
  .vw-msg.on{display:flex}
  .vw-msg b{font-family:"Didot","Songti SC",serif;font-weight:400;
    font-size:17px;letter-spacing:.12em;color:var(--ink)}
  .vw-msg p{margin:0;max-width:560px;font-size:11px;line-height:2;
    letter-spacing:.05em;color:var(--dim);white-space:pre-wrap}
  .vw-msg .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .vw-msg a,.vw-msg button{background:transparent;border:1px solid rgba(233,228,216,.3);
    color:var(--ink);font-size:10px;letter-spacing:.16em;padding:7px 14px;
    cursor:pointer;text-decoration:none;transition:border-color .2s ease}
  .vw-msg a:hover,.vw-msg button:hover{border-color:rgba(233,228,216,.7)}

  /* 作品页：打开查看器的入口 */
  #dact{display:none;margin-top:18px;pointer-events:auto}
  #dopen{display:inline-flex;align-items:center;gap:10px;background:rgba(5,6,10,.5);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border:1px solid rgba(233,228,216,.34);color:var(--ink);cursor:pointer;
    font-size:10px;letter-spacing:.26em;padding:11px 20px;
    transition:background .2s ease,border-color .2s ease}
  #dopen:hover{background:rgba(233,228,216,.1);border-color:rgba(233,228,216,.72)}
  #dopen i{font-style:normal;font-size:9px;opacity:.7;letter-spacing:.1em}
  .dsub .noent{color:rgba(233,228,216,.42)}

  /* 版本 / 提示词侧栏 */
  #dside{position:absolute;right:26px;top:96px;bottom:86px;width:312px;z-index:7;
    overflow:auto;pointer-events:auto;padding:16px 16px 18px;
    background:rgba(5,6,10,.84);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    border:1px solid rgba(233,228,216,.10);scrollbar-width:thin}
  #dside .side-h{display:flex;justify-content:space-between;align-items:baseline;
    font-size:8.5px;letter-spacing:.3em;color:rgba(233,228,216,.3);
    padding-bottom:8px;border-bottom:1px solid var(--hair)}
  #dside .side-h button{background:transparent;border:1px solid var(--hair);
    color:var(--dim);font-size:8.5px;letter-spacing:.16em;padding:3px 7px;
    cursor:pointer;transition:color .2s ease,border-color .2s ease}
  #dside .side-h button:hover,#dside .side-h button.on{color:var(--ink);
    border-color:rgba(233,228,216,.45)}
  .verchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .verchip{background:transparent;border:1px solid var(--hair);color:var(--dim);
    font-family:"Didot","Songti SC",serif;font-size:10px;letter-spacing:.1em;
    padding:4px 8px;cursor:pointer;transition:all .2s ease}
  .verchip:hover{color:var(--ink)}
  .verchip.on{color:#05060a;background:rgba(233,228,216,.9);border-color:rgba(233,228,216,.9)}
  .verchip b{font-weight:400;margin-left:6px;font-size:8px;letter-spacing:.12em;opacity:.62}
  #dside .at{margin-top:10px;font-size:9px;letter-spacing:.14em;color:rgba(233,228,216,.36)}
  #dside .pfull{margin-top:12px;font-size:9.5px;line-height:1.85;letter-spacing:.02em;
    color:rgba(233,228,216,.62);white-space:pre-wrap;word-break:break-word}
  #dside .pfull em{font-style:normal;color:rgba(233,228,216,.3);display:block;
    font-size:8px;letter-spacing:.24em;margin-bottom:5px}
  #dside .logh{margin-top:20px;padding-top:10px;border-top:1px solid var(--hair);
    font-size:8.5px;letter-spacing:.3em;color:rgba(233,228,216,.3)}
  .plog{margin-top:10px}
  .plog .e{padding:8px 0 10px;border-bottom:1px solid rgba(233,228,216,.07)}
  .plog .e .h{display:flex;gap:8px;align-items:baseline;font-size:8px;
    letter-spacing:.14em;color:rgba(233,228,216,.34)}
  .plog .e .h b{font-weight:400;color:rgba(233,228,216,.7)}
  .plog .e .x{margin-top:5px;font-size:9px;line-height:1.7;color:rgba(233,228,216,.64)}
  .plog .e .n{margin-top:4px;font-size:8.5px;line-height:1.6;color:rgba(233,228,216,.32)}
  .plog .e.sup .x,.plog .e.rej .x{opacity:.34;text-decoration:line-through}
  .plog .e.rej .h b{color:rgba(208,112,88,.8)}
  .plog .e .s{margin-left:auto;white-space:nowrap;opacity:.8}
  .dcmp{margin-top:14px;display:none}
  .dcmp.on{display:block}
  .dcmp .v{padding:9px 0;border-bottom:1px solid rgba(233,228,216,.07);
    font-size:9px;line-height:1.75;color:rgba(233,228,216,.56)}
  .dcmp .v b{font-weight:400;color:var(--ink);letter-spacing:.1em}
  .dcmp .v i{font-style:normal;color:rgba(233,228,216,.3);margin-left:6px}
  #dsideToggle{display:none;position:absolute;right:16px;top:70px;z-index:8;
    background:rgba(9,10,15,.9);border:1px solid var(--hair);color:var(--dim);
    font-size:9px;letter-spacing:.18em;padding:6px 9px;cursor:pointer}
  #dsideToggle.on{color:var(--ink);border-color:rgba(233,228,216,.45)}

  @media (max-width:640px){
    #sHead{padding:20px 18px}
    .s-brand b{font-size:16px;letter-spacing:.34em}
    #legend{left:18px;bottom:64px;line-height:2.4}
    #sFoot{bottom:20px}
    #hint{font-size:9px;letter-spacing:.14em}
    #card .card-in{width:176px}
    .card-in .shot{height:100px}
    #selection{left:18px;margin-top:18px;max-width:180px}
    #capPanel{left:18px;right:18px;top:auto;bottom:96px;width:auto}
    #dside{display:none;left:16px;right:16px;top:96px;bottom:auto;max-height:62vh;
      width:auto;background:rgba(5,6,10,.96);border:1px solid var(--hair);padding:14px}
    #dside.on{display:block}
    #dsideToggle{display:block}
    .dhead{padding:18px 16px}
    .dbrand b{font-size:15px;letter-spacing:.32em}
    .dmeta{left:16px;bottom:96px;max-width:calc(100% - 32px)}
    .dmeta h1{font-size:20px}
    .dmeta .dsub{font-size:9px;gap:0 10px}
    #drail{right:16px;bottom:18px}
    #drail .nav{width:28px;height:28px}
    .dfoot{display:none}
    .dmark .rule{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    .screen{transition:none}
    #intro{transition:none}
    .intro-in .bar::after{animation:none;left:0;width:100%;opacity:.5}
    #card, #card .card-in{transition:none}
    #dview .dlayer,#dvid{transition:none}
  }
</style>
</head>
<body>

<div id="star" class="screen on">
  <div id="stage"></div>
  <div id="vignette"></div>

  <header id="sHead">
    <div class="s-brand">
      <b>AI LAB</b>
      <span>星图 / STAR MAP</span>
      <div class="rule"></div>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div id="legend"></div>
  <div id="selection"></div>
  <div id="capPanel"><div class="cp-h" id="cpHead"></div><div class="cp-list" id="cpList"></div></div>
  <div id="card" aria-hidden="true"><div class="card-in">
    <div class="shot"><img alt=""></div>
    <div class="t"></div>
    <div class="m"></div>
    <div class="p"></div>
