<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI LAB · 星图</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#05060a;
    --ink:#e9e4d8;
    --dim:rgba(233,228,216,.46);
    --hair:rgba(233,228,216,.16);
    --c-image:#e4c798;
    --c-video:#8c9ad8;
    --c-web:#7cbcc2;
    --c-ppt:#cecbc2;
    --c-game:#d07058;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Helvetica Neue","PingFang SC","Hiragino Sans GB","Songti SC",sans-serif;
    -webkit-font-smoothing:antialiased}
  .screen{position:fixed;inset:0;opacity:0;pointer-events:none;
    transition:opacity .3s cubic-bezier(.4,0,.2,1)}
  .screen.on{opacity:1;pointer-events:auto}
  .fatal{position:fixed;inset:0;z-index:40;background:#05060a;display:none;
    align-items:center;justify-content:center;text-align:center;padding:40px;
    font-size:12px;letter-spacing:.08em;color:var(--dim);line-height:2;white-space:pre-wrap}
  .fatal.on{display:flex}

  /* ——— 星图 ——— */
  #star{z-index:1;background:var(--bg)}
  #stage{position:absolute;inset:0}
  #stage canvas{display:block}
  #vignette{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(5,6,10,0) 38%, rgba(5,6,10,.72) 100%),
      radial-gradient(60% 45% at 68% 30%, rgba(70,78,120,.10), rgba(0,0,0,0) 70%),
      radial-gradient(50% 40% at 22% 72%, rgba(120,84,52,.07), rgba(0,0,0,0) 72%);
  }
  #sHead{
    position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:26px 30px;pointer-events:none;z-index:6;
  }
  .s-brand b{
    font-family:"Didot","Songti SC",serif;font-weight:400;font-size:19px;
    letter-spacing:.42em;display:block;line-height:1;
  }
  .s-brand span{display:block;margin-top:10px;font-size:10px;letter-spacing:.28em;color:var(--dim)}
  .s-brand .rule{width:44px;height:1px;background:var(--hair);margin-top:14px}
  /* 能力图例：上方居中横排；字号放大到一眼可读，指到枝干时对应项放大提亮 */
  #legend{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:6;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:2px 30px;width:max-content;max-width:min(90vw,760px);
    font-size:15px;letter-spacing:.14em;color:var(--dim);line-height:1.9;
    text-align:center;pointer-events:auto}
  #legend .lg{cursor:default;transform-origin:50% 50%;transform:translateZ(0);
    transition:color .16s ease,transform .16s ease,opacity .16s ease,text-shadow .16s ease}
  #legend .lg.hot{transform:scale(1.16);color:rgba(240,236,226,.98);
    text-shadow:0 0 15px rgba(233,228,216,.3)}
  #legend .lg.dim{opacity:.44}
  #legend .lg:hover,#legend .lg.on{color:rgba(233,228,216,.95)}
  #legend .lg.empty{color:rgba(233,228,216,.24);cursor:default}
  #legend .lg.empty i{opacity:.35}
  #legend i{display:inline-block;width:17px;height:11px;margin-right:11px;vertical-align:0;
    border:1px solid rgba(233,228,216,.18);transition:transform .2s ease}
  #legend .lg.on i,#legend .lg.hot i{transform:scaleX(1.45)}
  #sFoot{position:absolute;left:0;right:0;bottom:26px;z-index:6;pointer-events:none;
    display:flex;justify-content:center}
  #hint{font-size:10px;letter-spacing:.22em;color:rgba(233,228,216,.34)}
  #hint b{font-weight:400;color:rgba(233,228,216,.6)}
  #selection{position:absolute;left:30px;top:50%;transform:translateY(46px);z-index:6;
    font-size:10px;letter-spacing:.2em;color:var(--dim);display:none;
    max-width:220px;line-height:1.9}
  #selection.on{display:block}
  #selection a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair)}
  #card{position:absolute;left:0;top:0;z-index:9;pointer-events:none;opacity:0;
    transform:translate(-50%,0);
    transition:opacity .22s ease}
  #card.on{opacity:1;pointer-events:auto}
  .card-in{width:min(366px,calc(100vw - 24px));padding:10px;
    background:rgba(9,10,15,.94);
    border:1px solid rgba(233,228,216,.16);
    box-shadow:0 20px 56px rgba(0,0,0,.6);
    transform:translateY(12px);
    transition:transform .26s cubic-bezier(.22,.61,.36,1)}
  #card.on .card-in{transform:translateY(0)}
  .card-in .shot{height:200px;overflow:hidden;background:#0b0c12}
  .card-in .shot img{width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(.82) brightness(.96)}
  #card.noimg .shot{display:none}
  .card-in .t{margin-top:9px;font-family:"Didot","Songti SC",serif;
    font-size:14px;line-height:1.35;letter-spacing:.02em}
  .card-in .m{margin-top:5px;font-size:9.5px;letter-spacing:.14em;color:rgba(233,228,216,.6);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-in .p{margin-top:8px;font-size:13px;line-height:1.72;letter-spacing:.01em;
    color:rgba(233,228,216,.88);display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden}
  .card-in .f{margin-top:8px;display:flex;justify-content:space-between;gap:8px;
    font-size:9px;letter-spacing:.14em;color:rgba(233,228,216,.52);white-space:nowrap}
  .card-in .f .k::before{content:"";display:inline-block;width:4px;height:4px;
    border-radius:50%;background:rgba(233,228,216,.26);margin-right:5px;vertical-align:1px}
  .card-in .f .k.live{color:rgba(233,228,216,.64)}
  .card-in .f .k.live::before{background:#7fd7c4}
  .card-in .go{display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;margin-top:10px;padding:10px 12px;cursor:pointer;
    background:rgba(127,215,196,.12);border:1px solid rgba(127,215,196,.48);
    color:#e6f6f1;font-family:inherit;font-size:10px;letter-spacing:.26em;
    transition:background .2s ease,border-color .2s ease}
  .card-in .go:hover{background:rgba(127,215,196,.22);
    border-color:rgba(127,215,196,.82)}
  .card-in .go b{font-weight:400;font-size:9px;opacity:.62;letter-spacing:.1em}
  .card-in .go[hidden]{display:none}
  #card.noprompt .p{display:none}
  #intro{position:absolute;inset:0;z-index:20;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:#04060a;transition:opacity .62s ease}
  #intro.done{opacity:0;pointer-events:none}
  /* 作品图墙：固定格数，四行，整体缓慢向右流动（图从左侧进来）；作品按顺序占位，余下留空 */
  #iWall{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;
    justify-content:center;gap:clamp(8px,1.1vh,14px);overflow:hidden;
    --ch:clamp(112px, calc((100vh - 44px) / 4), 220px);--cw:calc(var(--ch) * 1.32);
    opacity:0;transition:opacity .22s linear}
  #iWall.ready{opacity:1}
  #iWall .row{position:relative;display:flex;gap:clamp(8px,1.1vh,14px);width:max-content;
    animation:wallFlow 58s linear infinite}
  #iWall .row:nth-child(1){margin-left:-1.5%;animation-duration:58s;animation-delay:-2s}
  #iWall .row:nth-child(2){margin-left:-3%;animation-duration:71s;animation-delay:-1s}
  #iWall .row:nth-child(3){margin-left:-2%;animation-duration:52s;animation-delay:-2.5s}
  #iWall .row:nth-child(4){margin-left:-4%;animation-duration:64s;animation-delay:-1.5s}
  @keyframes wallFlow{from{transform:translate3d(calc(-50% - var(--fgap,0px) / 2),0,0)}
    to{transform:translate3d(0,0,0)}}
  #iWall .cell{flex:0 0 auto;width:var(--cw);height:var(--ch);position:relative;
    border-radius:2px;overflow:hidden;
    transition:transform .32s cubic-bezier(.2,.7,.2,1),opacity .32s ease}
  #iWall .cell img{width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(.8) brightness(1);opacity:.8;
    transition:filter .32s ease,opacity .32s ease}
  /* 空位：极淡斜纹 + 内描边，不做成灰方块，也不写任何字 */
  #iWall .cell.empty{
    background:
      repeating-linear-gradient(135deg, rgba(233,228,216,.022) 0 1px, rgba(233,228,216,0) 1px 10px),
      linear-gradient(158deg, rgba(233,228,216,.036), rgba(233,228,216,.008) 62%, rgba(233,228,216,.022));
    box-shadow:inset 0 0 0 1px rgba(233,228,216,.05)}
  #iWall.focus .cell{opacity:.5}
  #iWall.focus .cell.pin{opacity:1;z-index:1}
  #iWall.focus .cell.pin img{filter:none;opacity:1}
  /* 压暗：中间留出读字区，四周让图墙透出来 */
  #iWall::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    transition:opacity .32s ease;
    background:
      radial-gradient(42% 38% at 50% 50%, rgba(4,6,9,.94) 0%, rgba(4,6,9,.8) 44%,
        rgba(4,6,9,.34) 74%, rgba(4,6,9,.05) 100%),
      linear-gradient(180deg, rgba(4,6,9,.55), rgba(4,6,9,.16) 24%,
        rgba(4,6,9,.16) 76%, rgba(4,6,9,.6))}
  #iWall.focus::after{opacity:.62}
  /* 标题退场后压暗层也退掉，别在中间留一块无来由的暗斑 */
  #iWall.plain::after{opacity:.34}
  @media (max-width:560px){
    #iWall{--ch:clamp(84px, calc((100vh - 40px) / 4), 200px);--cw:calc(var(--ch) * 0.92)}
  }
  .intro-in{position:relative;z-index:3;text-align:center;width:min(86vw,520px);
    pointer-events:none;transition:opacity .34s ease}
  /* 退场分三段：轻淡 → 更淡 → 消失，1.4s，节奏沉着 */
  .intro-in.out{animation:introOut 1.4s cubic-bezier(.4,0,.6,1) forwards}
  @keyframes introOut{0%{opacity:1}28%{opacity:.72}58%{opacity:.34}100%{opacity:0}}
  .intro-in h1{margin:0;font-family:"Didot","Songti SC",serif;font-weight:400;
    font-size:clamp(26px,4vw,46px);letter-spacing:.52em;text-indent:.52em;
    color:rgba(233,228,216,.92);text-shadow:0 0 28px rgba(127,215,196,.16);
    animation:rise .55s ease-out both}
  .intro-in .ip{margin-top:26px;animation:rise .55s ease-out .06s both}
  @keyframes rise{from{opacity:0;transform:translate3d(0,8px,0)}
    to{opacity:1;transform:translate3d(0,0,0)}}
  .ip-track{height:2px;background:rgba(233,228,216,.09);overflow:hidden}
  .ip-track i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,rgba(127,215,196,.45),rgba(233,228,216,.9));
    box-shadow:0 0 12px rgba(127,215,196,.45);transition:width .3s linear}
  /* 加载完毕：等标题退场后再浮现，点击/轻触/回车进入星图 */
  #ready{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    pointer-events:none;opacity:0;transform:translate3d(0,6px,0);
    transition:opacity .55s ease,transform .55s ease}
  #ready.on{opacity:1;transform:none}
  /* 文字后面垫一层柔和暗场，压在亮图上也能读清；不吃点击 */
  #ready::before{content:"";position:absolute;left:50%;top:50%;z-index:0;
    width:min(94vw,620px);height:250px;transform:translate3d(-50%,-50%,0);
    pointer-events:none;
    background:radial-gradient(62% 50% at 50% 50%, rgba(3,5,9,.84),
      rgba(3,5,9,.52) 62%, rgba(3,5,9,0) 100%)}
  #ready .rd-t,#ready .rd-h{position:relative;z-index:1}
  #ready .rd-t{font-family:"Didot","Songti SC",serif;font-weight:400;
    font-size:clamp(20px,2.6vw,30px);letter-spacing:.42em;text-indent:.42em;
    color:rgba(233,228,216,.94);text-shadow:0 0 26px rgba(127,215,196,.2)}
  #ready .rd-h{font-size:10.5px;letter-spacing:.3em;text-indent:.3em;
    color:rgba(233,228,216,.5);animation:hintPulse 2.4s ease-in-out infinite}
  @keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:.92}}
  #intro.armed{cursor:pointer}

  /* ——— 能力页（#/<cap>）——— */
  #capPanel{position:absolute;right:30px;top:96px;z-index:6;width:252px;display:none;
    padding:14px 15px 16px;background:rgba(9,10,15,.84);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(233,228,216,.12)}
  #capPanel.on{display:block}
  #capPanel .cp-h{font-size:8.5px;letter-spacing:.3em;color:rgba(233,228,216,.34);
    padding-bottom:9px;border-bottom:1px solid var(--hair)}
  #capPanel .cp-h b{font-family:"Didot","Songti SC",serif;font-size:15px;font-weight:400;
    letter-spacing:.12em;color:var(--ink);display:block}
  #capPanel .cp-list{margin-top:4px;max-height:54vh;overflow:auto;scrollbar-width:thin}
  #capPanel .cp-list a{display:block;padding:8px 0;border-bottom:1px solid rgba(233,228,216,.07);
    color:rgba(233,228,216,.72);text-decoration:none;font-size:11px;line-height:1.45;
    letter-spacing:.02em;transition:color .18s ease}
  #capPanel .cp-list a:hover{color:var(--ink)}
  #capPanel .cp-list a i{font-style:normal;display:block;font-size:8px;letter-spacing:.18em;
    color:rgba(233,228,216,.3);margin-top:3px}
  #capPanel .cp-empty{font-size:9px;line-height:2;letter-spacing:.1em;
    color:rgba(233,228,216,.3);padding:10px 0}

  /* ——— 作品页（#/<cap>/<id>[/<ver>]）——— */
  #detail{z-index:12;background:#05060a}
  #dview{position:absolute;inset:0;background:#000;overflow:hidden}
  #dview .dlayer{position:absolute;inset:0;opacity:0;
    transition:opacity .25s cubic-bezier(.4,0,.2,1)}
  #dview .dlayer.on{opacity:1}
  #dview .dlayer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    transform-origin:50% 50%;will-change:transform;user-select:none;-webkit-user-drag:none}
  #dvid{position:absolute;left:0;top:0;width:100%;height:calc(100% - 196px);
    object-fit:contain;background:#000;opacity:0;
    transition:opacity .25s cubic-bezier(.4,0,.2,1)}
  #dvid.on{opacity:1}
  #detail.is-video .dfoot{display:none}
  #detail.is-video .dmeta{bottom:96px}
  #dshade{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:
      linear-gradient(to bottom, rgba(5,6,10,.82) 0%, rgba(5,6,10,0) 22%),
      linear-gradient(to top, rgba(5,6,10,.9) 0%, rgba(5,6,10,0) 30%),
      radial-gradient(120% 90% at 50% 50%, rgba(5,6,10,0) 55%, rgba(5,6,10,.55) 100%)}
  .dhead{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;
    justify-content:space-between;align-items:flex-start;padding:24px 30px;
    pointer-events:none}
  .dhead > *{pointer-events:auto}
  .dbrand a{color:var(--ink);text-decoration:none}
  .dbrand b{font-family:"Didot","Songti SC",serif;font-weight:400;font-size:18px;
    letter-spacing:.4em;display:block;line-height:1}
  .dbrand .dback{display:inline-block;margin-top:14px;font-size:10px;letter-spacing:.2em;
    color:var(--dim);text-decoration:none;border-bottom:1px solid var(--hair);
    padding-bottom:3px;transition:color .2s ease,border-color .2s ease}
  .dbrand .dback:hover{color:var(--ink);border-color:rgba(233,228,216,.5)}
  .dmark{text-align:right;font-size:9.5px;letter-spacing:.26em;color:var(--dim);line-height:1.9}
  .dmark .tag{color:var(--c-image);border:1px solid rgba(228,199,152,.32);
    padding:5px 9px;display:inline-block}
  .dmark .rule{width:46px;height:1px;background:var(--hair);margin:12px 0 0 auto}
  .dmeta{position:absolute;left:30px;bottom:54px;z-index:6;
    max-width:min(660px,48vw);pointer-events:none}
  .dmeta .didx{font-family:"Didot","Songti SC",serif;font-size:11px;letter-spacing:.22em;
    color:var(--dim);margin-bottom:12px}
  .dmeta .didx em{font-style:normal;color:var(--ink)}
  .dmeta h1{margin:0;font-family:"Didot","Songti SC",serif;font-weight:400;
    font-size:clamp(21px,2.5vw,34px);letter-spacing:.03em;line-height:1.28;
    text-wrap:balance}
  .dmeta .dsub{margin-top:10px;font-size:10px;letter-spacing:.2em;color:var(--dim);
    display:flex;flex-wrap:wrap;gap:0 14px}
  .dmeta .dsub em{font-style:normal;color:rgba(233,228,216,.78)}
  .dmeta .dsub i{display:inline-block;width:14px;height:1px;margin-right:7px;vertical-align:3px}
  /* 作品级一行简介 vs 版本级一段说明：层级与颜色明确区分 */
  .dmeta .dwork{margin-top:9px;max-width:560px;font-size:12px;letter-spacing:.03em;
    color:rgba(233,228,216,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dmeta .dwork b{font-weight:400;letter-spacing:.22em;color:rgba(233,228,216,.56);
    margin-right:9px}
  .dmeta .dver{margin-top:12px;max-width:560px}
  .dmeta .dver .vh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .dmeta .dver .vh b{font-weight:400;font-size:10px;letter-spacing:.2em;
    color:rgba(127,215,196,.92)}
  .dmeta .dver .vh span{font-size:12px;letter-spacing:.08em;color:rgba(233,228,216,.9)}
  .dmeta .dver .vh i{font-style:normal;font-size:10.5px;letter-spacing:.12em;
    color:rgba(233,228,216,.6)}
  .dmeta .dver p{margin:6px 0 0;font-size:13px;line-height:1.75;letter-spacing:.02em;
    color:rgba(233,228,216,.86)}
  #drail{position:absolute;right:30px;bottom:28px;z-index:6;display:flex;
    align-items:center;gap:14px}
  #drail .nav{width:30px;height:30px;border:1px solid var(--hair);background:transparent;
    color:var(--ink);font-size:11px;cursor:pointer;opacity:.62;
    transition:border-color .2s ease,opacity .2s ease}
  #drail .nav:hover{border-color:rgba(233,228,216,.45);opacity:1}
  #drail .nav:disabled{opacity:.16;cursor:default}
  #drail .count{font-size:10px;letter-spacing:.2em;color:var(--dim);min-width:56px;
    text-align:center}
  #drail .dots{display:flex;gap:6px;margin-right:4px}
  #drail .dots button{width:5px;height:5px;padding:0;border:0;border-radius:50%;
    cursor:pointer;background:rgba(233,228,216,.24);
    transition:background .25s ease,transform .25s ease}
  #drail .dots button.on{background:rgba(233,228,216,.8);transform:scale(1.5)}
  .dfoot{position:absolute;left:0;right:0;bottom:16px;z-index:5;display:flex;
    justify-content:center;pointer-events:none}
  .dfoot span{font-size:9.5px;letter-spacing:.2em;color:rgba(233,228,216,.3)}
  .dfoot b{font-weight:400;color:rgba(233,228,216,.52)}
  .dfatal{position:absolute;inset:0;z-index:20;background:#05060a;display:none;
    align-items:center;justify-content:center;text-align:center;padding:40px;
    font-size:12px;letter-spacing:.08em;color:var(--dim);line-height:2;
    white-space:pre-wrap}
  .dfatal.on{display:flex}

  /* ——— 统一全屏查看器（所有类型共用一个 HTML 入口）——— */
  #viewer{position:fixed;inset:0;z-index:40;background:#05060a;display:none;
    flex-direction:column}
  #viewer.on{display:flex}
  .vw-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;height:46px;
    padding:0 14px;background:rgba(5,6,10,.97);border-bottom:1px solid var(--hair)}
  .vw-bar button,.vw-bar a{background:transparent;border:1px solid var(--hair);
    color:var(--dim);font-size:9.5px;letter-spacing:.16em;padding:5px 10px;
    cursor:pointer;text-decoration:none;white-space:nowrap;
    transition:color .2s ease,border-color .2s ease}
  .vw-bar button:hover,.vw-bar a:hover{color:var(--ink);
    border-color:rgba(233,228,216,.45)}
  .vw-t{flex:1;min-width:0;font-size:9.5px;letter-spacing:.18em;color:rgba(233,228,216,.5);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vw-t b{font-weight:400;color:var(--ink)}
  .vw-stage{position:relative;flex:1;min-height:0;background:#05060a}
  #vwFrame{position:absolute;inset:0;width:100%;height:100%;border:0;
    background:#05060a;display:block}
  .vw-msg{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:40px;
    text-align:center;background:#05060a}
  .vw-msg.on{display:flex}
  .vw-msg b{font-family:"Didot","Songti SC",serif;font-weight:400;
    font-size:17px;letter-spacing:.12em;color:var(--ink)}

      "请确认打开的是完整的 ai-lab 目录，不要只拷贝 index.html。";

<script>
/* ===== 开场：作品图墙 =====
   放在 vendor 之前：thumb 是 data URI，脚本一到就能铺满并响应悬停，
   不必等 three / 3d-force-graph 下完。
   格子总数固定（四行 × 按视口宽算出的列数，1440 下 7×4 = 28 格）。
   作品缩略图按数据顺序依次占格，其余留空；以后新增作品自动落进下一个空位。 */
(function(){
  var wall = document.getElementById("iWall");
  if (!wall) return;
  var THUMBS = window.AI_LAB_THUMBS || {};
  var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ROWS = 4, rows = [], pinned = null, titleT = 0;

  function workKeys(){
    var out = [];
    for (var k in THUMBS){
      if (!THUMBS.hasOwnProperty(k)) continue;
      if (k.indexOf("@") >= 0) continue;   // 只要作品级封面，不用版本图
      out.push(k);
    }
    return out;
  }

  function clearPin(){
    if (!pinned) return;
    var all = wall.querySelectorAll(".cell");
    for (var i = 0; i < all.length; i++) all[i].style.transform = "";
    pinned.classList.remove("pin");
    pinned = null;
    wall.classList.remove("focus");
    for (var r = 0; r < rows.length; r++) rows[r].style.animationPlayState = "";
  }

  function setPin(cell){
    if (cell === pinned) return;
    clearPin();
    if (!cell) return;
    pinned = cell;
    wall.classList.add("focus");
    cell.classList.add("pin");
    for (var r = 0; r < rows.length; r++) rows[r].style.animationPlayState = "paused";

    // 先量完再改 transform，否则相邻格读到的是已经让开的位置
    var b = cell.getBoundingClientRect();
    var cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    var RX = b.width * 2.1, RY = b.height * 2.2;
    var push = b.width * 0.34;
    var all = wall.querySelectorAll(".cell");
    var plan = [];
    for (var i = 0; i < all.length; i++){
      var c = all[i];
      if (c === cell) continue;
      var q = c.getBoundingClientRect();
      var dx = (q.left + q.width / 2) - cx;
      var dy = (q.top + q.height / 2) - cy;
      var f = (1 - Math.min(1, Math.abs(dx) / RX)) * (1 - Math.min(1, Math.abs(dy) / RY));
      if (f <= 0.02) continue;
      plan.push([c, (dx >= 0 ? 1 : -1) * push * f, (dy >= 0 ? 1 : -1) * 26 * f, f]);
    }
    for (var j = 0; j < plan.length; j++){
      var p = plan[j];
      p[0].style.transform = "translate3d(" + p[1].toFixed(1) + "px," +
        p[2].toFixed(1) + "px,0) scale(" + (1 - 0.2 * p[3]).toFixed(3) + ")";
    }
    cell.style.transform = "scale(1.36)";
  }

  // 图一到位就亮出来，随后让「AI LAB」慢慢退场，别一直压在图上
  var titleAt = 0;
  function reveal(){
    wall.classList.add("ready");
    var delay = REDUCED ? 260 : 200;
    titleAt = performance.now() + delay + (REDUCED ? 260 : 1400);
    titleT = setTimeout(function(){
      var t = document.querySelector(".intro-in");
      if (t) t.classList.add("out");
      wall.classList.add("plain");
    }, delay);
  }

  // 探针：量出格宽高与间距（CSS 用的是 clamp，读计算值才准）
  var probe = document.createElement("div");
  probe.className = "row";
  var pc = document.createElement("div");
  pc.className = "cell";
  probe.appendChild(pc);
  wall.appendChild(probe);
  var cw = pc.offsetWidth || 160;
  var gap = parseFloat(getComputedStyle(probe).columnGap) || 10;
  wall.removeChild(probe);

  var list = workKeys();
  // 列数 = 铺满当前视口所需，且至少能装下已有作品（新增作品自动扩格，不用改代码）
  var perRow = Math.max(3,
    Math.ceil((window.innerWidth + gap) / (cw + gap)) + 1,
    Math.ceil(list.length / ROWS));

  for (var r = 0; r < ROWS; r++){
    var row = document.createElement("div");
    row.className = "row";
    for (var c = 0; c < perRow; c++){
      var cell = document.createElement("div");
      cell.className = "cell empty";
      row.appendChild(cell);
    }
    wall.appendChild(row);
    rows.push(row);
  }

  // 作品依次占位：一行一件、逐行轮流；列按视口能看到的宽度错开（宽屏错得开，窄屏收到同一列）
  var span = Math.max(2, window.innerWidth / (cw + gap));
  var step = Math.max(0, Math.round((span - 2) / 3));
  for (var i = 0; i < list.length; i++){
    var rr = i % ROWS;
    // 宽屏按可见列数错开；窄屏只够两列时交替落位，避免所有图叠在同一竖列
    var cc = step
      ? (1 + rr * step + Math.floor(i / ROWS)) % perRow
      : (rr % 2 + Math.floor(i / ROWS)) % perRow;
    var slot = rows[rr] && rows[rr].children[cc];
    if (!slot) continue;
    slot.className = "cell";
    var img = document.createElement("img");
    img.alt = "";
    img.draggable = false;
    img.decoding = "async";
    img.src = THUMBS[list[i]];
    slot.appendChild(img);
  }

  if (!REDUCED){
    // 复制一份，位移正好半行宽 → 首尾相接，无跳变
    for (var r2 = 0; r2 < ROWS; r2++){
      var kids = Array.prototype.slice.call(rows[r2].children);
      for (var k2 = 0; k2 < kids.length; k2++) rows[r2].appendChild(kids[k2].cloneNode(true));
    }
    wall.style.setProperty("--fgap", gap + "px");
    wall.addEventListener("pointermove", function(e){
      var t = e.target;
      var cell = t && t.closest ? t.closest(".cell") : null;
      if (cell && cell.classList.contains("empty")) cell = null;
      setPin(cell);
    });
    wall.addEventListener("pointerleave", function(){ setPin(null); });
  }

  // 建完立刻亮：不等 rAF（后面还有会阻塞解析的 vendor 脚本，rAF 可能被压到很久之后），
  // 也不等图片解码回调——data URI 解码极快，宁可先见格再看清画
  reveal();

  window.__labWallTitleAt = function(){ return titleAt; };
  window.__labWallStop = function(){
    if (titleT) clearTimeout(titleT);
    clearPin();
    wall.innerHTML = "";
    rows = [];
  };
})();
</script>
